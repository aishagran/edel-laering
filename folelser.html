<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Følelser 💗 – Edels Verden</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p1:#FF6B9D;--p2:#FFC75F;--p3:#6BCB77;--p4:#4D96FF;--p5:#C780E8;--ink:#2D2A4A;--shadow:rgba(45,42,74,0.14);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:linear-gradient(160deg,#FFF6FB,#FFF0F5);min-height:100vh;color:var(--ink);}

.topbar{background:white;padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px var(--shadow);position:sticky;top:0;z-index:50;}
.home-btn{text-decoration:none;font-size:1.4rem;background:#F4F4FB;border-radius:12px;padding:6px 12px;}
.logo{font-family:'Baloo 2',cursive;font-weight:800;font-size:1.2rem;}

.container{max-width:560px;margin:0 auto;padding:18px 16px 60px;}
.intro{color:#888;font-size:0.9rem;margin-bottom:16px;text-align:center;line-height:1.5;}

/* Big overview card */
.big-card{background:white;border-radius:22px;overflow:hidden;box-shadow:0 6px 20px var(--shadow);margin-bottom:22px;cursor:pointer;border:3px solid #FFD6E4;transition:transform 0.15s;}
.big-card:active{transform:scale(0.98);}
.big-card img{width:100%;display:block;}
.big-card .bc-label{padding:14px 18px;display:flex;align-items:center;gap:10px;font-family:'Baloo 2',cursive;font-size:1.1rem;font-weight:700;}
.bc-tag{margin-left:auto;font-size:0.75rem;background:var(--p1);color:white;font-weight:800;padding:5px 12px;border-radius:16px;}

.section-label{font-size:0.8rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#aaa;margin:6px 4px 12px;text-align:center;}

/* Emotion grid */
.emo-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.emo-card{background:white;border-radius:18px;overflow:hidden;box-shadow:0 4px 14px var(--shadow);cursor:pointer;border:3px solid transparent;transition:transform 0.15s;}
.emo-card:active{transform:scale(0.96);}
.emo-card img{width:100%;height:140px;object-fit:cover;object-position:top;display:block;}
.emo-card .ec-label{padding:10px 12px;text-align:center;font-family:'Baloo 2',cursive;font-weight:700;font-size:0.92rem;}
.e-glad{border-color:#FFE9B8;}   .e-glad .ec-label{color:#B8860B;}
.e-leiseg{border-color:#C9DFFA;} .e-leiseg .ec-label{color:#3A6FB8;}
.e-redd{border-color:#FFD9B0;}   .e-redd .ec-label{color:#C8721A;}
.e-sint{border-color:#FFC4C4;}   .e-sint .ec-label{color:#C0392B;}
.e-rolig{border-color:#C8E8CD;}  .e-rolig .ec-label{color:#3D7A52;}
.missing{height:140px;display:flex;align-items:center;justify-content:center;font-size:0.75rem;color:#B8962E;text-align:center;padding:10px;background:#FFF6E0;}

/* Fullscreen reader with pinch zoom */
.reader{display:none;position:fixed;inset:0;background:#1a1830;z-index:100;flex-direction:column;}
.reader.open{display:flex;}
.reader-bar{background:rgba(255,255,255,0.08);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
.reader-title{color:white;font-family:'Baloo 2',cursive;font-size:1rem;}
.reader-close{background:white;border:none;border-radius:12px;padding:7px 16px;font-weight:800;font-size:0.9rem;cursor:pointer;font-family:'Nunito',sans-serif;}
.reader-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom;}
.reader-scroll img{width:100%;height:auto;display:block;}
.reader-tip{color:rgba(255,255,255,0.6);text-align:center;font-size:0.75rem;padding:8px;}
</style>
</head>
<body>

<div class="topbar">
  <a class="home-btn" href="index.html">🏠</a>
  <div class="logo">💗 Følelser</div>
</div>

<div class="container">
  <p class="intro">Alle følelser er viktige og lov å ha. 💚<br>Trykk på en plakat for å se den stor!</p>

  <div class="big-card" onclick="openReader('folelser.png','💗 Alle følelsene')">
    <img src="folelser.png" alt="" onerror="this.outerHTML='<div class=missing style=height:180px>Last opp «folelser.png» 😊</div>'">
    <div class="bc-label">💗 Følelseshjulet <span class="bc-tag">Oversikt</span></div>
  </div>

  <div class="section-label">— Utforsk hver følelse —</div>

  <div class="emo-grid">
    <div class="emo-card e-glad" onclick="openReader('glad.png','😊 Glad / Glede')">
      <img src="glad.png" alt="" onerror="this.outerHTML='<div class=missing>Last opp «glad.png»</div>'">
      <div class="ec-label">😊 Glad / Glede</div>
    </div>
    <div class="emo-card e-leiseg" onclick="openReader('leiseg.png','💧 Lei seg / Tristhet')">
      <img src="leiseg.png" alt="" onerror="this.outerHTML='<div class=missing>Last opp «leiseg.png»</div>'">
      <div class="ec-label">💧 Lei seg</div>
    </div>
    <div class="emo-card e-redd" onclick="openReader('redd.png','👻 Redd / Frykt')">
      <img src="redd.png" alt="" onerror="this.outerHTML='<div class=missing>Last opp «redd.png»</div>'">
      <div class="ec-label">👻 Redd / Frykt</div>
    </div>
    <div class="emo-card e-sint" onclick="openReader('sint.png','🌋 Sint / Sinne')">
      <img src="sint.png" alt="" onerror="this.outerHTML='<div class=missing>Last opp «sint.png»</div>'">
      <div class="ec-label">🌋 Sint / Sinne</div>
    </div>
    <div class="emo-card e-rolig" onclick="openReader('rolig.png','🍃 Rolig / Trygg')">
      <img src="rolig.png" alt="" onerror="this.outerHTML='<div class=missing>Last opp «rolig.png»</div>'">
      <div class="ec-label">🍃 Rolig / Trygg</div>
    </div>
  </div>
</div>

<div class="reader" id="reader">
  <div class="reader-bar">
    <div class="reader-title" id="readerTitle"></div>
    <button class="reader-close" onclick="closeReader()">✕ Lukk</button>
  </div>
  <div class="reader-scroll"><img id="readerImg" src="" alt=""></div>
  <div class="reader-tip">Zoom med to fingre 🤏</div>
</div>

<script>
function openReader(file, title){
  document.getElementById('readerTitle').textContent = title;
  document.getElementById('readerImg').src = file;
  document.getElementById('reader').classList.add('open');
}
function closeReader(){
  document.getElementById('reader').classList.remove('open');
}
</script>
</body>
</html>
