<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edels Språkreise 🦜</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --p1:#FF6B9D; --p2:#FFC75F; --p3:#6BCB77; --p4:#4D96FF; --p5:#C780E8;
    --ink:#2D2A4A; --soft:#FFF6FB; --card:#FFFFFF;
    --yellow:#FFE873; --shadow:rgba(45,42,74,0.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito',sans-serif;background:linear-gradient(160deg,#FFF6FB,#F0F8FF);min-height:100vh;color:var(--ink);}

  .topbar{background:white;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px var(--shadow);position:sticky;top:0;z-index:50;}
  .logo{font-family:'Baloo 2',cursive;font-weight:800;font-size:1.3rem;display:flex;align-items:center;gap:8px;}
  .logo .bird{font-size:1.6rem;}
  .streak{background:var(--yellow);border-radius:20px;padding:5px 14px;font-weight:800;font-size:0.9rem;display:flex;align-items:center;gap:5px;}

  .container{max-width:560px;margin:0 auto;padding:18px 16px 80px;}

  /* Day selector */
  .day-pills{display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px;margin-bottom:8px;}
  .day-pill{flex-shrink:0;background:white;border:2px solid #eee;border-radius:16px;padding:10px 14px;text-align:center;cursor:pointer;font-weight:700;font-size:0.8rem;min-width:62px;transition:all 0.2s;}
  .day-pill .d-icon{font-size:1.3rem;display:block;margin-bottom:2px;}
  .day-pill.active{border-color:var(--p1);background:var(--p1);color:white;transform:translateY(-2px);}
  .day-pill.done{border-color:var(--p3);}
  .day-pill.done .d-icon::after{content:" ✓";}

  /* Intro card */
  .intro{background:linear-gradient(135deg,var(--p1),var(--p5));color:white;border-radius:22px;padding:22px;margin-bottom:18px;box-shadow:0 6px 20px var(--shadow);}
  .intro h2{font-family:'Baloo 2',cursive;font-size:1.4rem;margin-bottom:4px;}
  .intro p{font-size:0.92rem;opacity:0.95;}
  .intro .meta{margin-top:10px;font-size:0.82rem;background:rgba(255,255,255,0.25);display:inline-block;padding:4px 12px;border-radius:14px;}

  /* Exercise cards */
  .step{background:var(--card);border-radius:22px;padding:0;margin-bottom:16px;box-shadow:0 4px 16px var(--shadow);overflow:hidden;}
  .step-head{padding:14px 18px;display:flex;align-items:center;gap:10px;color:white;font-family:'Baloo 2',cursive;font-weight:700;font-size:1.05rem;}
  .step-head .num{background:rgba(255,255,255,0.3);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.95rem;}
  .h-card{background:var(--p4);} .h-rep{background:var(--p2);} .h-speak{background:var(--p3);} .h-build{background:var(--p5);} .h-game{background:var(--p1);}
  .step-body{padding:18px;}
  .step-instruction{font-size:0.9rem;color:#666;margin-bottom:14px;}

  /* Big visual card (Ebbe&Nebb style) */
  .visual-card{background:var(--yellow);border-radius:18px;padding:20px;text-align:center;margin-bottom:14px;border:3px solid #F4D03F;}
  .visual-card .big-emoji{font-size:3.5rem;line-height:1;margin-bottom:8px;display:block;}
  .visual-card .vc-text{font-family:'Baloo 2',cursive;font-size:1.3rem;font-weight:700;}
  .visual-card .vc-text .hl{color:var(--p1);}
  .visual-card.c2{background:#D6F5E3;border-color:#6BCB77;}
  .visual-card.c3{background:#D6E9FF;border-color:#4D96FF;}
  .visual-card.c4{background:#F3E0FF;border-color:#C780E8;}
  .visual-card.c5{background:#FFE0EC;border-color:#FF6B9D;}

  /* Repetition rows */
  .rep-row{display:flex;align-items:center;gap:12px;padding:12px;background:#FAFAFA;border-radius:14px;margin-bottom:8px;}
  .rep-row .r-emoji{font-size:2rem;flex-shrink:0;}
  .rep-row .r-text{font-size:1rem;font-weight:600;flex:1;}
  .rep-row .r-blank{border-bottom:3px dotted #bbb;min-width:80px;display:inline-block;}

  /* Speak box */
  .speak-box{background:#D6F5E3;border-radius:16px;padding:18px;text-align:center;}
  .speak-box .mic{font-size:2.5rem;margin-bottom:8px;}
  .speak-prompt{font-size:1.05rem;font-weight:700;margin-bottom:10px;}
  .speak-help{font-size:0.85rem;color:#557;background:white;border-radius:12px;padding:10px;margin-top:10px;}

  /* Buttons / inputs */
  .opt-grid{display:flex;flex-direction:column;gap:8px;}
  .opt{background:#F4F4FB;border:2px solid transparent;border-radius:14px;padding:12px 16px;font-size:0.98rem;font-weight:600;cursor:pointer;text-align:left;transition:all 0.15s;}
  .opt:active{transform:scale(0.98);}
  .opt.correct{background:#D6F5E3;border-color:var(--p3);color:#1B7A3D;}
  .opt.wrong{background:#FFE0E0;border-color:#E85D5D;color:#B22;}

  .txt-in{width:100%;border:2px solid #ddd;border-radius:14px;padding:12px;font-size:0.98rem;font-family:'Nunito',sans-serif;resize:vertical;outline:none;}
  .txt-in:focus{border-color:var(--p4);}

  .done-btn{width:100%;background:var(--p3);color:white;border:none;border-radius:16px;padding:14px;font-family:'Baloo 2',cursive;font-weight:700;font-size:1.05rem;cursor:pointer;margin-top:8px;transition:all 0.2s;}
  .done-btn:active{transform:scale(0.98);}
  .done-btn.completed{background:#bbb;}

  .reward{text-align:center;padding:30px 20px;background:linear-gradient(135deg,var(--p2),var(--p1));border-radius:22px;color:white;display:none;margin-top:10px;}
  .reward.show{display:block;animation:pop 0.5s;}
  @keyframes pop{0%{transform:scale(0.8);opacity:0;}100%{transform:scale(1);opacity:1;}}
  .reward .big{font-size:3rem;}
  .reward h2{font-family:'Baloo 2',cursive;font-size:1.6rem;margin:6px 0;}

  .parent-tip{background:#FFF3D6;border-radius:12px;padding:10px 14px;font-size:0.82rem;color:#7A5A00;margin-top:12px;display:flex;gap:8px;}
  .parent-tip .pt-icon{flex-shrink:0;}

  .flip{perspective:600px;cursor:pointer;}
  .flip-inner{transition:transform 0.5s;transform-style:preserve-3d;position:relative;}
  .flip.flipped .flip-inner{transform:rotateY(180deg);}
  .flip-front,.flip-back{backface-visibility:hidden;}
  .flip-back{position:absolute;top:0;left:0;width:100%;height:100%;transform:rotateY(180deg);display:flex;align-items:center;justify-content:center;}
</style>
</head>
<body>

<div class="topbar">
  <div style="display:flex;align-items:center;gap:10px;"><a href="index.html" style="text-decoration:none;font-size:1.3rem;background:#F4F4FB;border-radius:12px;padding:4px 10px;">🏠</a><div class="logo"><span class="bird">🦜</span> Edels Språkreise</div></div>
  <div class="streak">🔥 <span id="streakNum">0</span></div>
</div>

<div class="container">

  <div class="day-pills" id="dayPills"></div>

  <div id="lessonArea"></div>

</div>

      ], tip:"«Før» og «etter at» plasserer ting i tid — som «først» og «etterpå», men mer presist."},
      {type:"choice", head:"Velg riktig", q:"___ treningen tar vi på drakten.",
        opts:[{t:"Etter at",c:false},{t:"Før",c:true},{t:"Hvis",c:false}],
        tip:"Drakten kommer FØR treningen starter."},
      {type:"speak", head:"Si det selv", emoji:"🗣️", prompt:"Hva gjør du FØR skolen? Og ETTER skolen?",
        help:"Før skolen ___ . Etter skolen ___",
        tip:"To korte setninger holder. Strukturen før/etter gir henne et trygt rammeverk."},
      {type:"build", head:"Bygg setningen", steps:["Jeg trente.","Jeg trente taekwondo.","Jeg trente taekwondo etter skolen.","Etter at jeg hadde trent taekwondo, var jeg sliten, men stolt."],
        tip:"Legg merke til at setningen kan STARTE med «etter at» — det er avansert!"},
    ]
  },
  {
    icon:"🌟", name:"Dag 10", theme:"Min uke",
    color:"var(--p5)",
    intro:{title:"Min uke 🌟", text:"Siste dag! I dag bruker vi ALLE bindeordene og forteller om hele uken."},
    steps:[
      {type:"visual", head:"Se og les", emoji:"🌟", text:"Jeg kan fortelle om <span class='hl'>hele uken</span>!", cardClass:""},
      {type:"rep", head:"Les høyt – 3 ganger", rows:[
        {emoji:"1️⃣", text:"<b>Først, etterpå, til slutt</b> — rekkefølge."},
        {emoji:"❓", text:"<b>Fordi</b> — forklarer hvorfor."},
        {emoji:"💡", text:"<b>Men, derfor</b> — problem og løsning."},
        {emoji:"⏰", text:"<b>Da, når, hvis, før, etter at</b> — tid."},
      ], tip:"Dette er verktøykassen hennes! Alle bindeordene fra to uker samlet."},
      {type:"choice", head:"Velg riktig", q:"Hvilket ord forklarer HVORFOR noe skjedde?",
        opts:[{t:"men",c:false},{t:"fordi",c:true},{t:"før",c:false}],
        tip:""},
      {type:"speak", head:"Si det selv", emoji:"🗣️", prompt:"Fortell om HELE uken din! Bruk så mange bindeord du klarer.",
        help:"Først… etterpå… fordi… men… derfor… til slutt…",
        tip:"Dette er den store testen — fri fortelling med struktur. Tell gjerne bindeordene sammen etterpå og feir hvert eneste ett!"},
      {type:"build", head:"Bygg setningen", steps:["Jeg lærte.","Jeg lærte nye ord.","Jeg lærte nye ord denne uken.","Jeg lærte nye ord denne uken, og nå føler jeg tilhørighet fordi jeg kan fortelle mer."],
        tip:"Ukens ord «tilhørighet» + «fordi» — en perfekt avslutning! 💚"},
    ]
  },
];

// ============ STATE ============
let currentDay = 0;
let completed = JSON.parse('{}'); // can't use localStorage; in-memory only
let dayDone = {};

// ============ RENDER ============
function renderPills(){
  const wrap = document.getElementById('dayPills');
  wrap.innerHTML = '';
  DAYS.forEach((d,i)=>{
    const pill = document.createElement('div');
    pill.className = 'day-pill' + (i===currentDay?' active':'') + (dayDone[i]?' done':'');
    pill.innerHTML = `<span class="d-icon">${d.icon}</span>${d.name}`;
    pill.onclick = ()=>{ currentDay=i; render(); };
    wrap.appendChild(pill);
  });
}

function render(){
  renderPills();
  const day = DAYS[currentDay];
  const area = document.getElementById('lessonArea');
  let html = `<div class="intro" style="background:linear-gradient(135deg,${day.color},var(--p5))">
    <h2>${day.intro.title}</h2>
    <p>${day.intro.text}</p>
    <div class="meta">⏱️ 10–15 minutter • 5 steg</div>
  </div>`;

  day.steps.forEach((step,si)=>{
    const stepId = `d${currentDay}s${si}`;
    html += `<div class="step"><div class="step-head ${headClass(step.type)}"><span class="num">${si+1}</span> ${step.head}</div><div class="step-body">`;

    if(step.type==='visual'){
      html += `<div class="visual-card ${step.cardClass}">
        <span class="big-emoji">${step.emoji}</span>
        <div class="vc-text">${step.text}</div>
      </div>
      <p class="step-instruction">👀 Se på bildet og les setningen høyt sammen.</p>`;
    }
    else if(step.type==='rep'){
      step.rows.forEach(r=>{
        html += `<div class="rep-row"><span class="r-emoji">${r.emoji}</span><span class="r-text">${r.text}</span></div>`;
      });
      if(step.tip) html += parentTip(step.tip);
    }
    else if(step.type==='choice'){
      html += `<p class="step-instruction">${step.q}</p><div class="opt-grid">`;
      step.opts.forEach((o,oi)=>{
        html += `<button class="opt" onclick="pickOpt(this,${o.c})">${o.t}</button>`;
      });
      html += `</div>`;
      if(step.tip) html += parentTip(step.tip);
    }
    else if(step.type==='speak'){
      html += `<div class="speak-box">
        <div class="mic">🎤</div>
        <div class="speak-prompt">${step.prompt}</div>
        <div class="speak-help">💬 ${step.help}</div>
      </div>`;
      if(step.tip) html += parentTip(step.tip);
    }
    else if(step.type==='build'){
      step.steps.forEach((s,bi)=>{
        const bold = bi===step.steps.length-1?'font-weight:800;':'';
        html += `<div class="rep-row" style="${bold}"><span class="r-emoji">${bi+1}️⃣</span><span class="r-text">${s}</span></div>`;
        if(bi<step.steps.length-1) html += `<div style="text-align:center;color:var(--p5);font-size:1.2rem;margin:-2px 0;">↓</div>`;
      });
      html += `<textarea class="txt-in" rows="2" placeholder="Lag din egen lange setning her..."></textarea>`;
      if(step.tip) html += parentTip(step.tip);
    }

    html += `</div></div>`;
  });

  html += `<button class="done-btn ${dayDone[currentDay]?'completed':''}" onclick="finishDay()">${dayDone[currentDay]?'✓ Fullført!':'Jeg er ferdig for i dag! 🎉'}</button>`;
  html += `<div class="reward" id="reward"><div class="big">🦜🌟</div><h2>Bra jobbet, Edel!</h2><p>Du fullførte dagens språkreise!</p></div>`;

  area.innerHTML = html;
  window.scrollTo({top:0,behavior:'smooth'});
}

function headClass(type){
  return {visual:'h-card',rep:'h-rep',choice:'h-build',speak:'h-speak',build:'h-build',game:'h-game'}[type]||'h-card';
}
function parentTip(text){
  return `<div class="parent-tip"><span class="pt-icon">💡</span><span><b>Til forelder:</b> ${text}</span></div>`;
}
function pickOpt(btn,correct){
  const grid = btn.parentNode;
  if(grid.querySelector('.correct,.wrong')) return;
  if(correct){ btn.classList.add('correct'); btn.innerHTML='✓ '+btn.innerHTML; }
  else{
    btn.classList.add('wrong');
    [...grid.children].forEach(b=>{ if(b!==btn) b.disabled=true; });
  }
}
function finishDay(){
  dayDone[currentDay]=true;
  const streak = Object.keys(dayDone).length;
  document.getElementById('streakNum').textContent = streak;
  document.getElementById('reward').classList.add('show');
  renderPills();
  document.querySelector('.done-btn').classList.add('completed');
  document.querySelector('.done-btn').textContent='✓ Fullført!';
  setTimeout(()=>document.getElementById('reward').scrollIntoView({behavior:'smooth'}),100);
}

render();
</script>
</body>
</html>
