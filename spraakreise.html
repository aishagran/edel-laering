<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edels Språkreise 🦜</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p1:#FF6B9D;--p2:#FFC75F;--p3:#6BCB77;--p4:#4D96FF;--p5:#C780E8;--ink:#2D2A4A;--shadow:rgba(45,42,74,0.14);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:linear-gradient(160deg,#FFF6FB,#FFF9EC);min-height:100vh;color:var(--ink);}
.logo{font-family:'Baloo 2',cursive;font-weight:800;font-size:1.2rem;}
.topbar{background:white;padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px var(--shadow);position:sticky;top:0;z-index:50;}
.home-btn{text-decoration:none;font-size:1.4rem;background:#F4F4FB;border-radius:12px;padding:6px 12px;}
.fire{font-size:1.4rem;margin-left:auto;}
.container{max-width:560px;margin:0 auto;padding:20px 18px 80px;}
.intro{background:white;border-radius:16px;padding:16px;margin-bottom:20px;box-shadow:0 3px 12px var(--shadow);line-height:1.6;color:#666;}
.day-pills{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;margin-bottom:16px;}
.day-pill{flex-shrink:0;background:white;border:2.5px solid #e8e0d8;border-radius:50px;padding:10px 16px;font-weight:700;font-size:0.9rem;cursor:pointer;transition:all 0.15s;}
.day-pill.active{background:var(--p3);color:white;border-color:var(--p3);}
.day-pill:active{transform:scale(0.96);}
.content{background:white;border-radius:18px;overflow:hidden;box-shadow:0 5px 18px var(--shadow);display:none;}
.content.active{display:block;}
.day-header{background:linear-gradient(135deg,var(--p3),#7ec898);padding:20px;color:white;}
.day-num{font-family:'Baloo 2',cursive;font-size:2rem;margin-bottom:4px;}
.day-theme{font-size:1.1rem;font-weight:700;}
.section{padding:18px;border-bottom:1px solid #f0ebe4;}
.section:last-child{border-bottom:none;}
.section-title{font-family:'Baloo 2',cursive;font-size:0.95rem;font-weight:800;color:var(--p3);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px;}
.example-box{background:var(--p3);background:rgba(107,203,119,0.1);border-left:4px solid var(--p3);padding:12px 14px;border-radius:8px;margin-bottom:10px;line-height:1.6;font-size:0.95rem;}
.sentence-build{display:flex;flex-direction:column;gap:10px;}
.build-step{background:#f9f9f9;padding:12px;border-radius:10px;border-left:4px solid var(--p2);font-size:0.95rem;line-height:1.5;}
.build-step .num{display:inline-block;background:var(--p2);color:#7A5A00;font-weight:800;padding:3px 9px;border-radius:20px;font-size:0.8rem;margin-right:8px;}
.input-box{background:#f9f9f9;border:2px dashed var(--p3);border-radius:12px;padding:14px;margin-top:12px;}
.input-box textarea{width:100%;border:none;background:transparent;font-family:'Nunito',sans-serif;font-size:0.95rem;resize:vertical;min-height:80px;color:var(--ink);}
.input-box textarea::placeholder{color:#bbb;}
.btn-complete{width:100%;margin-top:16px;padding:16px;background:var(--p3);color:white;border:none;border-radius:50px;font-family:'Baloo 2',cursive;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #4d8a52;transition:all 0.1s;}
.btn-complete:active{transform:translateY(3px);box-shadow:0 1px 0 #4d8a52;}
.tip{background:#FFF9E0;border-left:4px solid var(--p2);padding:12px 14px;border-radius:8px;margin-top:12px;font-size:0.9rem;line-height:1.5;color:#7A5A00;}
</style>
</head>
<body>

<div class="topbar">
  <a class="home-btn" href="index.html">🏠</a>
  <div style="display:flex;align-items:center;gap:10px;">
    <span class="bird">🦜</span><div class="logo">Edels Språkreise</div>
  </div>
  <div class="fire" id="fireCount">🔥 0</div>
</div>

<div class="container">
  <div class="intro">
    <strong>Hei, Edel!</strong> Hver dag øver du på nye bindeord — ord som kobler setninger sammen. Les, gjenta, snakk høyt, og skriv din egen! 💚
  </div>

  <div class="day-pills" id="dayPills"></div>
  <div id="daysContent"></div>
</div>

<script>
const DAYS = [
  {
    icon:"🏫", name:"Dag 1", theme:"Min dag på skolen",
    intro:{title:"Først… Etterpå… Senere… Til slutt…", text:"Disse ordene forteller hva som skjedde først, så, og til slutt."},
    steps:[
      {type:"visual", head:"Se og les", emoji:"🏫", text:"<b>Først</b> gikk jeg til skolen. <b>Etterpå</b> hadde vi gym."},
      {type:"rep", head:"Les høyt – 3 ganger", rows:[
        "Først gikk jeg til skolen.",
        "Etterpå hadde vi gym.",
        "Senere spilte vi kanonball.",
        "Til slutt syklet jeg hjem.",
      ], tip:"Repetisjon bygger automatikk. Les raskere hver gang!"},
      {type:"speak", head:"Si det høyt selv", emoji:"🗣️", prompt:"Fortell om DIN dag på skolen i dag!",
        help:"Først… Etterpå… Senere… Til slutt…"},
      {type:"build", head:"Bygg setningen", steps:["Jeg spilte.","Jeg spilte kanonball.","Jeg spilte kanonball med Eyla.","Jeg spilte kanonball med Eyla, og det var gøy."]},
    ]
  },
  {
    icon:"🤾", name:"Dag 2", theme:"Kanonball",
    intro:{title:"Hvem? Hvor? Hva? Hva skjedde?", text:"Disse spørsmålene hjelper deg å fortelle en god historie."},
    steps:[
      {type:"visual", head:"Se og les", emoji:"🎯", text:"<b>Hvem?</b> Jeg var med Eyla. <b>Hvor?</b> På banen."},
      {type:"rep", head:"Les høyt – 3 ganger", rows:[
        "Hvem? Jeg var med Eyla.",
        "Hvor? På banen i gymsalen.",
        "Hva? Vi spilte kanonball.",
        "Hva skjedde? Vi tapte mot 7A.",
      ]},
      {type:"speak", head:"Si det høyt selv", emoji:"🗣️", prompt:"Fortell om en gang du lekte eller spilte noe!",
        help:"Hvem var du med? Hvor? Hva gjorde dere?"},
      {type:"build", head:"Bygg setningen", steps:["Vi tapte.","Vi tapte kampen.","Vi tapte kampen mot 7A.","Vi tapte kampen mot 7A, men vi hadde det gøy."]},
    ]
  },
  {
    icon:"🏓", name:"Dag 3", theme:"Håndball",
    intro:{title:"Fordi – forklarer grunnen!", text:"Når du sier «fordi» viser du HVORFOR noe skjedde."},
    steps:[
      {type:"visual", head:"Se og les", emoji:"🏓", text:"Jeg spurte Unna om å spille. Hun sa ja <b>fordi</b> det er gøy."},
      {type:"rep", head:"Les høyt – 3 ganger", rows:[
        "Jeg spurte Unna om jeg kunne spille.",
        "Unna sa ja.",
        "Hvorfor? Fordi det er gøy.",
        "Vi fikk brownies fordi vi trente hardt.",
      ]},
      {type:"speak", head:"Si det høyt selv", emoji:"🗣️", prompt:"Hva liker du å gjøre — og HVORFOR?",
        help:"Jeg liker ___ fordi ___"},
      {type:"build", head:"Bygg setningen", steps:["Jeg spurte.","Jeg spurte Unna.","Jeg spurte Unna om å spille.","Jeg spurte Unna om å spille, og hun sa ja forbi det er gøy."]},
    ]
  },
  {
    icon:"🛍️", name:"Dag 4", theme:"På Manglerud senter",
    intro:{title:"Men – og Derfor – problem og løsning!", text:"«Men» viser at noe gikk galt. «Derfor» viser hva du gjorde."},
    steps:[
      {type:"visual", head:"Se og les", emoji:"🛍️", text:"Vi fant en gul t-skjorte. <b>Men</b> jeg glemte brillene. <b>Derfor</b> måtte vi dra tilbake."},
      {type:"rep", head:"Les høyt – 3 ganger", rows:[
        "Vi skulle finne et kostyme.",
        "Vi fant en gul t-skjorte.",
        "Men jeg glemte brillene mine.",
        "Derfor måtte vi dra tilbake.",
      ]},
      {type:"speak", head:"Si det høyt selv", emoji:"🗣️", prompt:"Fortell om en gang du glemte noe!",
        help:"Jeg glemte ___. Derfor måtte jeg ___"},
      {type:"build", head:"Bygg setningen", steps:["Jeg glemte.","Jeg glemte brillene.","Jeg glemte brillene på senteret.","Jeg glemte brillene på senteret, derfor måtte mamma hjelpe meg."]},
    ]
  },
  {
    icon:"🎬", name:"Dag 5", theme:"K-drama & musikk",
    intro:{title:"Følelsesord – ord som beskriver hvordan du føler", text:"K-drama er fullt av følelser! Perfekt for å øve på nye ord."},
    steps:[
      {type:"visual", head:"Se og les", emoji:"🎬", text:"Karakteren var <b>forelsket</b>. Hun var <b>trist</b> fordi vennen løy."},
      {type:"rep", head:"Les høyt – 3 ganger", rows:[
        "Karakteren var forelsket.",
        "Hun var trist fordi vennen løy.",
        "Det var en stor hemmelighet.",
        "Han ville ha hevn.",
      ]},
      {type:"speak", head:"Si det høyt selv", emoji:"🗣️", prompt:"Hvilken følelse gir din favoritt-serie deg?",
        help:"Jeg liker ___ fordi det gjør meg ___ (glad / rørt / spent)"},
      {type:"build", head:"Bygg setningen", steps:["Jeg så på.","Jeg så på et K-drama.","Jeg så på et K-drama i går.","Jeg så på et K-drama i går, og det gjorde meg både glad og trist."]},
    ]
  },
  {
    icon:"🐕", name:"Dag 6", theme:"Pipocão",
    intro:{title:"Da – og Når – tid!", text:"«Da» = en gang. «Når» = hver gang."},
    steps:[
      {type:"visual", head:"Se og les", emoji:"🐕", text:"<b>Da</b> jeg kom hjem, logret Pipocão med halen. <b>Når</b> jeg er trist, sitter han hos meg."},
      {type:"rep", head:"Les høyt – 3 ganger", rows:[
        "Da jeg kom hjem, logret Pipocão med halen.",
        "Når jeg er trist, sitter Pipocão hos meg.",
        "Da vi gikk tur, møtte vi en katt.",
        "Når Pipocão er sulten, bjeffer han.",
      ]},
      {type:"speak", head:"Si det høyt selv", emoji:"🗣️", prompt:"Hva skjer NÅR eller DA med Pipocão?",
        help:"Når jeg kommer hjem, ___. Da vi gikk tur, ___"},
      {type:"build", head:"Bygg setningen", steps:["Pipocão logret.","Pipocão logret med halen.","Pipocão logret med halen da jeg kom hjem.","Pipocão logret med halen da jeg kom hjem, fordi han var glad for å se meg."]},
    ]
  },
  {
    icon:"🤾", name:"Dag 7", theme:"Håndballkamp",
    intro:{title:"Hvis – tanke på fremtiden!", text:"«Hvis» betyr: «det som KAN skje hvis du gjør noe»."},
    steps:[
      {type:"visual", head:"Se og les", emoji:"🏆", text:"<b>Hvis</b> jeg øver, blir jeg bedre. <b>Hvis</b> vi vinner, blir jeg glad."},
      {type:"rep", head:"Les høyt – 3 ganger", rows:[
        "Hvis jeg øver, blir jeg bedre.",
        "Hvis vi vinner, blir jeg glad.",
        "Hvis jeg er sliten, hviler jeg.",
        "Hvis noen er alene, kan jeg spørre: Vil du være med?",
      ]},
      {type:"speak", head:"Si det høyt selv", emoji:"🗣️", prompt:"Hva skjer HVIS du trener hver dag?",
        help:"Hvis jeg ___, så ___"},
      {type:"build", head:"Bygg setningen", steps:["Vi vant.","Vi vant kampen.","Vi vant kampen i går.","Vi vant kampen i går, og hvis vi fortsetter å trene, vinner vi igjen."]},
    ]
  },
  {
    icon:"🏫", name:"Dag 8", theme:"Friminuttet",
    intro:{title:"Spaced retrieval – alle ordene fra uke 1!", text:"Nå bruker vi ukens ord fra Edels Verden i nye setninger!"},
    steps:[
      {type:"visual", head:"Se og les", emoji:"🤗", text:"Edel ble <b>ekskludert</b> da ingen svarte. Hun følte <b>avvist</b> og <b>oversett</b>."},
      {type:"rep", head:"Les høyt – 3 ganger", rows:[
        "Edel ble ekskludert da ingen svarte.",
        "Hun følte seg avvist og oversett.",
        "En voksen hjalp barna med å inkludere henne.",
        "Til slutt følte hun tilhørighet og fellesskap.",
      ]},
      {type:"speak", head:"Si det høyt selv", emoji:"🗣️", prompt:"Hva kan DU si hvis noen står alene?",
        help:"Vil du være med? / Kom og spill med oss!"},
      {type:"build", head:"Bygg setningen", steps:["Hun spurte.","Hun spurte om å være med.","Hun spurte om å være med, men ingen svarte.","Hun spurte om å være med, men ingen svarte, derfor følte hun seg ekskludert."]},
    ]
  },
  {
    icon:"🥋", name:"Dag 9", theme:"Taekwondo",
    intro:{title:"Før – og Etter at – rekkefølge!", text:"Disse ordene viser hva som kommer først og hva som kommer etterpå."},
    steps:[
      {type:"visual", head:"Se og les", emoji:"🥋", text:"<b>Før</b> treningen tar vi på drakten. <b>Etter at</b> vi har bukket, starter treningen."},
      {type:"rep", head:"Les høyt – 3 ganger", rows:[
        "Før treningen tar vi på drakten.",
        "Etter at vi har bukket, starter treningen.",
        "Før kampen er jeg spent.",
        "Etter treningen er jeg sliten, men glad.",
      ]},
      {type:"speak", head:"Si det høyt selv", emoji:"🗣️", prompt:"Hva gjør du FØR og ETTER skolen?",
        help:"Før skolen ___. Etter skolen ___"},
      {type:"build", head:"Bygg setningen", steps:["Jeg trente.","Jeg trente taekwondo.","Jeg trente taekwondo etter skolen.","Etter at jeg hadde trent taekwondo, var jeg sliten, men stolt."]},
    ]
  },
  {
    icon:"🌟", name:"Dag 10", theme:"Min uke",
    intro:{title:"Alle bindeordene sammen! 🎉", text:"Nå bruker du ALLE bindeordene fra to uker! Du er en språkmester!"},
    steps:[
      {type:"visual", head:"Se og les", emoji:"🌟", text:"<b>Først, etterpå, til slutt</b> — <b>fordi</b> — <b>men, derfor</b> — <b>da, når, hvis, før, etter at</b> — alle sammen!"},
      {type:"rep", head:"Les høyt – 3 ganger", rows:[
        "Først, etterpå, til slutt — rekkefølge.",
        "Fordi — forklarer hvorfor.",
        "Men, derfor — problem og løsning.",
        "Da, når, hvis, før, etter at — tid og betingelse.",
      ]},
      {type:"speak", head:"Si det høyt selv", emoji:"🗣️", prompt:"Fortell om HELE uken din! Bruk så mange bindeord som du klarer.",
        help:"Først… etterpå… fordi… men… derfor… til slutt…"},
      {type:"build", head:"Bygg setningen", steps:["Jeg lærte.","Jeg lærte nye ord.","Jeg lærte nye ord denne uken.","Jeg lærte nye ord denne uken, og nå føler jeg tilhørighet fordi jeg kan fortelle mer."]},
    ]
  },
];

let currentDay = 0;
const storageKey = "edels_spraakreise_fire";

function init(){
  renderPills();
  renderContent();
  loadFireCount();
  updateFireCount();
}

function renderPills(){
  const pills = document.getElementById('dayPills');
  pills.innerHTML = DAYS.map((d,i) => `
    <button class="day-pill ${i===currentDay?'active':''}" onclick="switchDay(${i})">${d.name}</button>
  `).join('');
}

function renderContent(){
  const content = document.getElementById('daysContent');
  const day = DAYS[currentDay];
  let html = `<div class="content active">
    <div class="day-header">
      <div class="day-num">${day.icon}</div>
      <div class="day-theme">${day.theme}</div>
    </div>`;
  
  day.steps.forEach((s,si) => {
    html += `<div class="section">`;
    if(s.type === 'visual'){
      html += `<div class="section-title">${s.head}</div>
        <div class="example-box">${s.text}</div>`;
    } else if(s.type === 'rep'){
      html += `<div class="section-title">${s.head}</div>`;
      s.rows.forEach(r => html += `<div class="example-box">${r}</div>`);
      html += `<div class="tip">💡 ${s.tip}</div>`;
    } else if(s.type === 'speak'){
      html += `<div class="section-title">${s.head}</div>
        <div class="example-box"><strong>Spørsmål:</strong> ${s.prompt}</div>
        <div class="tip">💬 ${s.help}</div>`;
    } else if(s.type === 'build'){
      html += `<div class="section-title">${s.head}</div><div class="sentence-build">`;
      s.steps.forEach((st,i) => html += `<div class="build-step"><span class="num">${i+1}</span>${st}</div>`);
      html += `</div>
        <div class="input-box">
          <textarea placeholder="Lag din egen setning her..." id="input${si}"></textarea>
        </div>`;
    }
    html += `</div>`;
  });
  
  html += `<div style="padding:18px;text-align:center;">
    <button class="btn-complete" onclick="completeDay()">Jeg er ferdig for i dag! 🎉</button>
  </div></div>`;
  
  content.innerHTML = html;
}

function switchDay(i){
  currentDay = i;
  document.querySelectorAll('.day-pill').forEach((p,idx) => {
    p.classList.toggle('active', idx === i);
  });
  renderContent();
}

function completeDay(){
  const day = DAYS[currentDay];
  const inputs = document.querySelectorAll('textarea');
  const userTexts = Array.from(inputs).map(t => t.value).filter(v => v.trim());
  const userText = userTexts.length > 0 ? userTexts.join(' — ') : '(ingen skrevet)';
  
  // Send email
  sendEmail(day, userText);
  
  // Update fire
  const fire = parseInt(localStorage.getItem(storageKey) || '0') + 1;
  localStorage.setItem(storageKey, fire);
  updateFireCount();
  
  // Next day
  if(currentDay < DAYS.length - 1){
    setTimeout(() => switchDay(currentDay + 1), 800);
  } else {
    alert('🎉 Du har fullført hele Språkreisen! Du er fantastisk, Edel!');
  }
}

async function sendEmail(day, userText){
  const now = new Date();
  const dato = now.toLocaleDateString('no-NO',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  const tid = now.toLocaleTimeString('no-NO',{hour:'2-digit',minute:'2-digit'});
  
  try{
    await fetch('https://formspree.io/f/mqeolldg',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        _subject: `Edels Språkreise – ${day.name} – ${dato}`,
        Dato: dato,
        Tidspunkt: tid,
        Dag: day.name,
        Tema: day.theme,
        Tekst_hun_skrev: userText,
        Bindeord_fokus: day.intro.title,
      })
    });
  } catch(e){ console.log(e); }
}

function loadFireCount(){
  const fire = localStorage.getItem(storageKey) || '0';
  document.getElementById('fireCount').textContent = '🔥 ' + fire;
}

function updateFireCount(){
  loadFireCount();
}

init();
</script>
</body>
</html>
