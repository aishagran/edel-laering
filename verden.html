<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ukens ord 📚 – Edels Verden</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p1:#FF6B9D;--p2:#FFC75F;--p3:#6BCB77;--p4:#4D96FF;--p5:#C780E8;--ink:#2D2A4A;--shadow:rgba(45,42,74,0.14);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:linear-gradient(160deg,#E8F5EC,#F0F8FF);min-height:100vh;color:var(--ink);}
.topbar{background:white;padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px var(--shadow);position:sticky;top:0;z-index:50;}
.home-btn{text-decoration:none;font-size:1.4rem;background:#F4F4FB;border-radius:12px;padding:6px 12px;}
.logo{font-family:'Baloo 2',cursive;font-weight:800;font-size:1.2rem;}
.score{margin-left:auto;font-size:1.4rem;}
.container{max-width:560px;margin:0 auto;padding:20px 18px 100px;}
.week-label{font-size:0.8rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#888;margin:24px 0 12px;padding-left:4px;}
.chapters{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;}
.chapter-card{background:white;border-radius:18px;overflow:hidden;box-shadow:0 4px 16px var(--shadow);border:3px solid #d4eeda;cursor:pointer;transition:all 0.15s;}
.chapter-card:active{transform:scale(0.97);}
.chapter-card.completed{border-color:var(--p3);background:rgba(107,203,119,0.05);}
.ch-header{background:var(--p3);padding:16px;display:flex;align-items:center;gap:14px;color:white;}
.ch-emoji{font-size:36px;}
.ch-info{flex:1;}
.ch-day{font-size:0.8rem;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;opacity:0.9;}
.ch-title{font-family:'Baloo 2',cursive;font-size:1.1rem;font-weight:700;margin:2px 0;}
.ch-desc{font-size:0.85rem;opacity:0.9;line-height:1.3;}
.ch-badge{font-size:1.2rem;}
.lesson-wrap{background:white;border-radius:18px;overflow:hidden;box-shadow:0 5px 18px var(--shadow);display:none;margin-bottom:20px;}
.lesson-wrap.active{display:block;}
.lesson-header{background:var(--p3);padding:18px;color:white;}
.lesson-title{font-family:'Baloo 2',cursive;font-size:1.2rem;margin-bottom:8px;}
.progress-bar{height:8px;background:rgba(255,255,255,0.3);border-radius:10px;overflow:hidden;margin-top:10px;}
.progress-fill{height:100%;background:white;border-radius:10px;transition:width 0.3s;}
.lesson-body{padding:18px;max-height:600px;overflow-y:auto;}
.step{display:none;margin-bottom:18px;}
.step.active{display:block;animation:fadeIn 0.3s;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.step-label{font-size:0.8rem;font-weight:800;text-transform:uppercase;color:#888;margin-bottom:8px;}
.scene-card{background:#f9f9f9;border-radius:12px;padding:14px;margin-bottom:12px;border-left:4px solid var(--p3);}
.scene-num{display:inline-block;background:var(--p3);color:white;font-weight:800;padding:3px 9px;border-radius:20px;font-size:0.8rem;margin-bottom:6px;}
.scene-text{font-size:0.95rem;font-weight:700;line-height:1.5;margin:8px 0;}
.scene-speech{background:#E8F5EC;border-left:4px solid var(--p3);padding:10px 12px;border-radius:8px;font-size:0.9rem;font-weight:600;color:var(--p3);margin:8px 0;}
.word-card{background:#f9f9f9;border-radius:12px;padding:14px;margin-bottom:12px;border-left:4px solid var(--p3);}
.word-card.neg{border-left-color:var(--p1);}
.word-main{font-family:'Baloo 2',cursive;font-size:1.1rem;color:var(--p3);margin-bottom:4px;font-weight:700;}
.word-card.neg .word-main{color:#c0566a;}
.word-meaning{font-size:0.85rem;color:#888;margin-bottom:8px;}
.word-example{font-size:0.9rem;font-weight:600;background:white;padding:9px 12px;border-radius:8px;line-height:1.4;margin:6px 0;}
.question-card{background:#f9f9f9;border-radius:12px;padding:14px;margin-bottom:12px;}
.q-text{font-size:0.95rem;font-weight:700;margin-bottom:12px;line-height:1.4;}
.options{display:flex;flex-direction:column;gap:8px;}
.opt-btn{background:white;border:2px solid #e0d8d0;border-radius:10px;padding:11px 12px;font-size:0.9rem;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;transition:all 0.15s;}
.opt-btn.correct{background:var(--p3);color:white;border-color:var(--p3);}
.opt-btn.wrong{background:#FFE0E8;color:#c0566a;border-color:var(--p1);}
.opt-btn.disabled{pointer-events:none;opacity:0.5;}
.fill-sentence{font-size:0.95rem;font-weight:700;padding:12px;background:#FFF9E0;border:2px dashed var(--p2);border-radius:10px;line-height:1.5;margin-bottom:12px;}
.blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--p3);color:var(--p3);font-weight:800;}
.fill-opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.fill-chip{background:white;border:2px solid #c5dfc0;border-radius:50px;padding:7px 14px;font-size:0.85rem;font-weight:700;color:var(--p3);cursor:pointer;transition:all 0.15s;}
.fill-chip.used{opacity:0.3;pointer-events:none;}
.fill-chip.correct{background:var(--p3);color:white;border-color:var(--p3);}
.feedback{border-radius:10px;padding:11px 12px;font-size:0.85rem;font-weight:700;margin-top:8px;display:none;line-height:1.4;}
.feedback.show{display:block;}
.feedback.correct{background:var(--p3);color:white;border:2px solid #a8d5b5;}
.feedback.wrong{background:#FFE0E8;color:#c0566a;border:2px solid var(--p1);}
.btn-next{width:100%;padding:12px;background:var(--p3);color:white;border:none;border-radius:50px;font-family:'Baloo 2',cursive;font-size:0.95rem;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #4d8a52;transition:all 0.1s;margin-top:12px;}
.btn-next:active{transform:translateY(2px);box-shadow:0 1px 0 #4d8a52;}
.end-screen{background:linear-gradient(160deg,#E8F5EC,#F0FFFE);padding:40px 24px;text-align:center;border-radius:18px;margin-bottom:20px;display:none;}
.end-screen.active{display:block;}
.end-emoji{font-size:64px;margin-bottom:12px;}
.end-title{font-family:'Baloo 2',cursive;font-size:1.5rem;color:var(--p3);margin-bottom:6px;}
.end-sub{font-size:0.95rem;color:#666;margin-bottom:16px;}
.score-big{font-family:'Baloo 2',cursive;font-size:2.2rem;color:var(--p3);margin-bottom:4px;}
.btn-home{background:white;color:var(--p3);border:2px solid var(--p3);border-radius:50px;padding:11px 32px;font-family:'Baloo 2',cursive;font-size:0.95rem;font-weight:700;cursor:pointer;width:100%;margin-bottom:8px;}
.btn-retry{background:var(--p3);color:white;border:none;border-radius:50px;padding:11px 32px;font-family:'Baloo 2',cursive;font-size:0.95rem;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #4d8a52;width:100%;}
</style>
</head>
<body>

<div class="topbar">
  <a class="home-btn" href="index.html">🏠</a>
  <div class="logo">📚 Ukens ord</div>
  <div class="score" id="scoreDisplay">0/0</div>
</div>

<div class="container">
  <div id="chaptersContainer"></div>
  <div class="lesson-wrap" id="lesson"></div>
  <div class="end-screen" id="endScreen"></div>
</div>

        {type:'scene', scenes:[{num:1, text:'Edel hjelper Petter med et ord.', speech:'Det ord betyr...'},{num:2, text:'Hun blir lærer for sin lillebror.'}]},
        {type:'multiple', q:'Hva blir Edel?', opts:[{t:'Lærer',c:true},{t:'Elev',c:false}], fb:'✅!'},
        {type:'words', subtitle:'🏫 Undervisning', words:[{w:'formidling', m:'dele kunnskap', ex:'Edel gjør formidling.', neg:false},{w:'visdom', m:'klok forståelse', ex:'Hun viser visdom.', neg:false}]},
        {type:'fillin', sentence:'Edels ___ hjelper Petter å lære.',opts:['visdom','forvirring'], correct:'visdom', fb:'✅!'},
      ]}
    ]
  }
];

let currentChapter = 0;
let currentStep = 0;
let score = 0;
let totalQ = 0;
let answered = false;
const completed = {};

function getAllChapters(){
  let all = [];
  WEEKS.forEach(w => w.chapters.forEach(ch => all.push({...ch, week: w.week})));
  return all;
}

function init(){
  renderChapters();
}

function renderChapters(){
  let html = '';
  WEEKS.forEach(w => {
    html += `<div class="week-label">📖 ${w.title}</div><div class="chapters">`;
    w.chapters.forEach((ch, i) => {
      const allCh = getAllChapters();
      const globalIdx = allCh.findIndex(c => c.name === ch.name);
      html += `<div class="chapter-card ${completed[globalIdx]?'completed':''}" onclick="startChapter(${globalIdx})">
        <div class="ch-header">
          <div class="ch-emoji">${ch.emoji}</div>
          <div class="ch-info">
            <div class="ch-day">Dag ${w.chapters.length*(w.week-1)+i+1}</div>
            <div class="ch-title">${ch.name}</div>
            <div class="ch-desc">${ch.desc}</div>
          </div>
          <div class="ch-badge">${completed[globalIdx]?'✅':'▶️'}</div>
        </div>
      </div>`;
    });
    html += '</div>';
  });
  document.getElementById('chaptersContainer').innerHTML = html;
}

function startChapter(idx){
  currentChapter = idx;
  currentStep = 0;
  score = 0;
  totalQ = 0;
  answered = false;
  const allCh = getAllChapters();
  const ch = allCh[idx];
  renderLesson(ch);
}

function renderLesson(ch){
  const lessonEl = document.getElementById('lesson');
  lessonEl.classList.add('active');
  lessonEl.innerHTML = '';
  window.scrollTo(0,0);
  
  const html = ch.steps.map((step, si) => {
    let stepHtml = `<div class="step" id="step${si}">`;
    
    if(step.type === 'scene'){
      stepHtml += `<div class="step-label">📖 Les historien</div>`;
      step.scenes.forEach(s => {
        stepHtml += `<div class="scene-card">
          <div class="scene-num">Scene ${s.num}</div>
          <div class="scene-text">${s.text}</div>
          ${s.speech?`<div class="scene-speech">${s.speech}</div>`:''}
        </div>`;
      });
    }
    else if(step.type === 'multiple'){
      totalQ++;
      stepHtml += `<div class="step-label">❓ Spørsmål</div>
        <div class="question-card">
          <div class="q-text">${step.q}</div>
          <div class="options">`;
      step.opts.forEach((o, oi) => {
        stepHtml += `<button class="opt-btn" onclick="checkMult(${currentChapter},${si},${oi},'${step.fb}')">${o.t}</button>`;
      });
      stepHtml += `</div><div class="feedback" id="fb${si}"></div></div>`;
    }
    else if(step.type === 'words'){
      stepHtml += `<div class="step-label">📚 Lær ordene</div><div style="font-size:0.85rem;color:#888;margin-bottom:10px;font-weight:600;">${step.subtitle}</div>`;
      step.words.forEach(w => {
        stepHtml += `<div class="word-card ${w.neg?'neg':''}">
          <div class="word-main">${w.neg?'😔':'😊'} ${w.w}</div>
          <div class="word-meaning">${w.m}</div>
          <div class="word-example">"${w.ex}"</div>
        </div>`;
      });
    }
    else if(step.type === 'fillin'){
      totalQ++;
      const parts = step.sentence.split('___');
      stepHtml += `<div class="step-label">✏️ Fyll inn ordet</div>
        <div class="question-card">
          <div class="fill-sentence">${parts[0]}<span class="blank" id="blank${si}">___</span>${parts[1]||''}</div>
          <div class="fill-opts">`;
      step.opts.forEach(o => {
        stepHtml += `<button class="fill-chip" onclick="checkFill(${currentChapter},${si},'${o}','${step.correct}','${step.fb}')">${o}</button>`;
      });
      stepHtml += `</div><div class="feedback" id="fb${si}"></div></div>`;
    }
    
    stepHtml += `</div>`;
    return stepHtml;
  }).join('');
  
  const allCh = getAllChapters();
  const totalSteps = allCh[currentChapter].steps.length;
  lessonEl.innerHTML = `<div class="lesson-header">
    <div class="lesson-title">${ch.name}</div>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
  </div>
  <div class="lesson-body">${html}</div>
  <button class="btn-next" onclick="nextStep()">Neste →</button>`;
  showStep(0);
}

function showStep(idx){
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById(`step${idx}`).classList.add('active');
  const allCh = getAllChapters();
  const total = allCh[currentChapter].steps.length;
  const pct = Math.round(((idx+1) / total) * 100);
  document.getElementById('progress').style.width = pct + '%';
  window.scrollTo(0, document.querySelector('.lesson-wrap').offsetTop - 100);
}

function checkMult(chIdx, stepIdx, optIdx, fb){
  if(answered) return;
  answered = true;
  const allCh = getAllChapters();
  const step = allCh[chIdx].steps[stepIdx];
  const isCorrect = step.opts[optIdx].c;
  const btns = document.querySelectorAll(`#step${stepIdx} .opt-btn`);
  btns.forEach(b => b.classList.add('disabled'));
  const fbEl = document.getElementById(`fb${stepIdx}`);
  
  if(isCorrect){
    btns[optIdx].classList.add('correct');
    score++;
    fbEl.textContent = fb;
    fbEl.className = 'feedback show correct';
  } else {
    btns[optIdx].classList.add('wrong');
    btns[step.opts.findIndex(o=>o.c)].classList.add('correct');
    fbEl.textContent = '❌ ' + fb;
    fbEl.className = 'feedback show wrong';
  }
}

function checkFill(chIdx, stepIdx, chosen, correct, fb){
  if(answered) return;
  answered = true;
  const blank = document.getElementById(`blank${stepIdx}`);
  const chips = document.querySelectorAll(`#step${stepIdx} .fill-chip`);
  chips.forEach(c => c.classList.add('used'));
  const fbEl = document.getElementById(`fb${stepIdx}`);
  
  blank.textContent = chosen === correct ? chosen : correct;
  if(chosen === correct){
    chips.forEach(c => {if(c.textContent === correct) c.classList.add('correct')});
    score++;
    fbEl.textContent = fb;
    fbEl.className = 'feedback show correct';
  } else {
    chips.forEach(c => {
      if(c.textContent === chosen) c.classList.add('wrong');
      if(c.textContent === correct) c.classList.add('correct');
    });
    fbEl.textContent = '❌ ' + fb;
    fbEl.className = 'feedback show wrong';
  }
}

function nextStep(){
  const allCh = getAllChapters();
  currentStep++;
  if(currentStep >= allCh[currentChapter].steps.length){
    completed[currentChapter] = true;
    showEnd(allCh[currentChapter]);
  } else {
    answered = false;
    showStep(currentStep);
  }
}

function showEnd(ch){
  const html = `
    <div class="end-emoji">⭐</div>
    <div class="end-title">Kjempebra!</div>
    <div class="end-sub">Du fullførte «${ch.name}»! 💚</div>
    <div class="score-big">${score}/${totalQ}</div>
    <div style="font-size:0.85rem;color:#888;margin-bottom:16px;">riktige svar</div>
    <button class="btn-home" onclick="goHome()">🏠 Tilbake til menyen</button>
    <button class="btn-retry" onclick="startChapter(${currentChapter})">🔄 Øv igjen</button>
  `;
  document.getElementById('lesson').classList.remove('active');
  const endEl = document.getElementById('endScreen');
  endEl.innerHTML = html;
  endEl.classList.add('active');
  
  sendEmail(ch);
  updateScore();
  renderChapters();
}

async function sendEmail(ch){
  const now = new Date();
  const dato = now.toLocaleDateString('no-NO',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  const tid = now.toLocaleTimeString('no-NO',{hour:'2-digit',minute:'2-digit'});
  const pct = Math.round((score / totalQ) * 100);
  
  try{
    await fetch('https://formspree.io/f/mqeolldg',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        _subject: `Edels Verden – ${ch.name} – ${dato}`,
        Dato: dato,
        Tidspunkt: tid,
        Kapittel: ch.name,
        Resultat: `${score} av ${totalQ} riktige (${pct}%)`,
        Vurdering: pct===100?'🌟 Perfekt!':pct>=70?'✅ Veldig bra!':'💪 Fortsett å øve!'
      })
    });
  } catch(e){ console.log(e); }
}

function goHome(){
  document.getElementById('lesson').classList.remove('active');
  document.getElementById('endScreen').classList.remove('active');
  window.scrollTo(0,0);
}

function updateScore(){
  document.getElementById('scoreDisplay').textContent = `${score}/${totalQ}`;
}

init();
</script>
</body>
</html>
