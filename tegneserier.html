<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tegneserier 📖 – Edels Verden</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p1:#FF6B9D;--p2:#FFC75F;--p3:#6BCB77;--p4:#4D96FF;--p5:#C780E8;--ink:#2D2A4A;--shadow:rgba(45,42,74,0.14);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:linear-gradient(160deg,#FFF6FB,#FFF9EC);min-height:100vh;color:var(--ink);}

.topbar{background:white;padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px var(--shadow);position:sticky;top:0;z-index:50;}
.home-btn{text-decoration:none;font-size:1.4rem;background:#F4F4FB;border-radius:12px;padding:6px 12px;}
.logo{font-family:'Baloo 2',cursive;font-weight:800;font-size:1.2rem;}

.container{max-width:560px;margin:0 auto;padding:18px 16px 60px;}
.intro{color:#888;font-size:0.9rem;margin-bottom:16px;text-align:center;}

.comic-card{background:white;border-radius:22px;overflow:hidden;box-shadow:0 5px 18px var(--shadow);margin-bottom:18px;cursor:pointer;border:3px solid transparent;transition:transform 0.15s;}
.comic-card:active{transform:scale(0.98);}
.comic-thumb{width:100%;max-height:240px;object-fit:cover;object-position:top;display:block;background:#FFF3D6;}
.comic-thumb.missing{height:130px;display:flex;align-items:center;justify-content:center;font-size:0.85rem;color:#B8962E;text-align:center;padding:16px;}
.comic-info{padding:14px 18px;display:flex;align-items:center;gap:12px;}
.comic-emoji{font-size:30px;}
.comic-title{font-family:'Baloo 2',cursive;font-size:1.05rem;font-weight:700;flex:1;}
.comic-open{font-size:0.78rem;background:var(--p2);color:#7A5A00;font-weight:800;padding:5px 12px;border-radius:16px;}

/* Fullscreen reader – pinch zoom enabled */
.reader{display:none;position:fixed;inset:0;background:#1a1830;z-index:100;flex-direction:column;}
.reader.open{display:flex;}
.reader-bar{background:rgba(255,255,255,0.08);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
.reader-title{color:white;font-family:'Baloo 2',cursive;font-size:1rem;}
.reader-close{background:white;border:none;border-radius:12px;padding:7px 16px;font-weight:800;font-size:0.9rem;cursor:pointer;font-family:'Nunito',sans-serif;}
.reader-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom;}
.reader-scroll img{width:100%;height:auto;display:block;}
.reader-tip{color:rgba(255,255,255,0.6);text-align:center;font-size:0.75rem;padding:8px;}
</style>
</head>
<body>

<div class="topbar">
  <a class="home-btn" href="index.html">🏠</a>
  <div class="logo">📖 Tegneserier</div>
</div>

<div class="container">
  <p class="intro">Trykk på en historie for å lese den! 🔍 Du kan zoome med to fingre.</p>
  <div id="comicList"></div>
</div>

<div class="reader" id="reader">
  <div class="reader-bar">
    <div class="reader-title" id="readerTitle"></div>
    <button class="reader-close" onclick="closeReader()">✕ Lukk</button>
  </div>
  <div class="reader-scroll"><img id="readerImg" src="" alt=""></div>
  <div class="reader-tip">Zoom med to fingre 🤏 · Bla nedover for å lese</div>
</div>

<script>
// Legg til flere historier her — bare last opp bildet på GitHub med samme filnavn!
const COMICS = [
  {file:"skjebnehjulet.png", emoji:"🌟", title:"Edel – Vokteren av Skjebnehjulet"},
  {file:"pipoka.png", emoji:"🐕", title:"Pipoka hjemme alene – Lojalitet"},
  {file:"mestre.png",  emoji:"🥋", title:"Edel mestrer det"},
  {file:"mesteren.png",    emoji:"🥋", title:"Edel og Mesteren – Forsvarerord"},
  {file:"friminuttet.png", emoji:"🏫", title:"Edel i friminuttet"},
  {file:"kaktus.png",      emoji:"🌵", title:"Edel i friminuttet – kaktusversjonen"},
];

const list = document.getElementById('comicList');
COMICS.forEach(c=>{
  const card = document.createElement('div');
  card.className = 'comic-card';
  card.innerHTML = `
    <img class="comic-thumb" src="${c.file}" alt=""
         onerror="this.outerHTML='<div class=\\'comic-thumb missing\\'>Last opp «${c.file}» på GitHub, så vises historien her 😊</div>'">
    <div class="comic-info">
      <span class="comic-emoji">${c.emoji}</span>
      <span class="comic-title">${c.title}</span>
      <span class="comic-open">Les →</span>
    </div>`;
  card.onclick = ()=>openReader(c);
  list.appendChild(card);
});

function openReader(c){
  document.getElementById('readerTitle').textContent = c.emoji+' '+c.title;
  document.getElementById('readerImg').src = c.file;
  document.getElementById('reader').classList.add('open');
}
function closeReader(){
  document.getElementById('reader').classList.remove('open');
}
</script>
</body>
</html>
