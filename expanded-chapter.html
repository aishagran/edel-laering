<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Når Edel ble inkludert – Ukens ord 📚</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p1:#FF6B9D;--p2:#FFC75F;--p3:#6BCB77;--p4:#4D96FF;--p5:#C780E8;--ink:#2D2A4A;--shadow:rgba(45,42,74,0.14);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:linear-gradient(160deg,#E8F5EC,#F0F8FF);min-height:100vh;color:var(--ink);}
.topbar{background:white;padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px var(--shadow);position:sticky;top:0;z-index:50;}
.home-btn{text-decoration:none;font-size:1.4rem;background:#F4F4FB;border-radius:12px;padding:6px 12px;}
.logo{font-family:'Baloo 2',cursive;font-weight:800;font-size:1.2rem;}
.score{margin-left:auto;font-size:1.4rem;}
.container{max-width:560px;margin:0 auto;padding:20px 18px 100px;}
.lesson-wrap{background:white;border-radius:18px;overflow:hidden;box-shadow:0 5px 18px var(--shadow);margin-bottom:20px;}
.lesson-header{background:var(--p3);padding:18px;color:white;}
.lesson-title{font-family:'Baloo 2',cursive;font-size:1.3rem;margin-bottom:8px;}
.progress-bar{height:8px;background:rgba(255,255,255,0.3);border-radius:10px;overflow:hidden;margin-top:10px;}
.progress-fill{height:100%;background:white;border-radius:10px;transition:width 0.3s;}
.lesson-body{padding:18px;max-height:600px;overflow-y:auto;}
.step{display:none;margin-bottom:18px;}
.step.active{display:block;animation:fadeIn 0.3s;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.step-label{font-size:0.8rem;font-weight:800;text-transform:uppercase;color:#888;margin-bottom:8px;}
.scene-card{background:#f9f9f9;border-radius:12px;padding:14px;margin-bottom:12px;border-left:4px solid var(--p3);}
.scene-num{display:inline-block;background:var(--p3);color:white;font-weight:800;padding:3px 9px;border-radius:20px;font-size:0.8rem;margin-bottom:6px;}
.scene-text{font-size:0.95rem;font-weight:700;line-height:1.5;margin:8px 0;}
.scene-speech{background:#E8F5EC;border-left:4px solid var(--p3);padding:10px 12px;border-radius:8px;font-size:0.9rem;font-weight:600;color:var(--p3);margin:8px 0;}
.listen-btn{background:var(--p4);color:white;border:none;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;margin-top:10px;font-size:0.95rem;box-shadow:0 2px 8px rgba(77,150,255,0.3);}
.listen-btn:active{transform:scale(0.97);}
.word-card{background:#f9f9f9;border-radius:12px;padding:14px;margin-bottom:12px;border-left:4px solid var(--p3);}
.word-card.neg{border-left-color:var(--p1);}
.word-main{font-family:'Baloo 2',cursive;font-size:1.1rem;color:var(--p3);margin-bottom:4px;font-weight:700;}
.word-card.neg .word-main{color:#c0566a;}
.word-meaning{font-size:0.85rem;color:#888;margin-bottom:8px;}
.word-example{font-size:0.9rem;font-weight:600;background:white;padding:9px 12px;border-radius:8px;line-height:1.4;margin:6px 0;}
.question-card{background:#f9f9f9;border-radius:12px;padding:14px;margin-bottom:12px;}
.q-text{font-size:0.95rem;font-weight:700;margin-bottom:12px;line-height:1.4;}
.options{display:flex;flex-direction:column;gap:8px;}
.opt-btn{background:white;border:2px solid #e0d8d0;border-radius:10px;padding:11px 12px;font-size:0.9rem;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;transition:all 0.15s;}
.opt-btn.correct{background:var(--p3);color:white;border-color:var(--p3);}
.opt-btn.wrong{background:#FFE0E8;color:#c0566a;border-color:var(--p1);}
.opt-btn.disabled{pointer-events:none;opacity:0.5;}
.match-container{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.match-item{background:white;border:2px solid #e0d8d0;border-radius:10px;padding:10px;font-size:0.85rem;font-weight:600;cursor:pointer;transition:all 0.15s;text-align:center;}
.match-item.left{background:#f9f9f9;}
.match-item.selected{border-color:var(--p3);background:rgba(107,203,119,0.1);}
.fill-sentence{font-size:0.95rem;font-weight:700;padding:12px;background:#FFF9E0;border:2px dashed var(--p2);border-radius:10px;line-height:1.5;margin-bottom:12px;}
.blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--p3);color:var(--p3);font-weight:800;}
.fill-opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.fill-chip{background:white;border:2px solid #c5dfc0;border-radius:50px;padding:7px 14px;font-size:0.85rem;font-weight:700;color:var(--p3);cursor:pointer;transition:all 0.15s;}
.fill-chip.used{opacity:0.3;pointer-events:none;}
.fill-chip.correct{background:var(--p3);color:white;border-color:var(--p3);}
.feedback{border-radius:10px;padding:11px 12px;font-size:0.85rem;font-weight:700;margin-top:8px;display:none;line-height:1.4;}
.feedback.show{display:block;}
.feedback.correct{background:var(--p3);color:white;border:2px solid #a8d5b5;}
.feedback.wrong{background:#FFE0E8;color:#c0566a;border:2px solid var(--p1);}
.btn-next{width:100%;padding:12px;background:var(--p3);color:white;border:none;border-radius:50px;font-family:'Baloo 2',cursive;font-size:0.95rem;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #4d8a52;transition:all 0.1s;margin-top:12px;}
.btn-next:active{transform:translateY(2px);box-shadow:0 1px 0 #4d8a52;}
.end-screen{background:linear-gradient(160deg,#E8F5EC,#F0FFFE);padding:40px 24px;text-align:center;border-radius:18px;margin-bottom:20px;display:none;}
.end-screen.active{display:block;}
.end-emoji{font-size:64px;margin-bottom:12px;}
.end-title{font-family:'Baloo 2',cursive;font-size:1.5rem;color:var(--p3);margin-bottom:6px;}
.score-big{font-family:'Baloo 2',cursive;font-size:2.5rem;color:var(--p3);margin-bottom:4px;}
.btn-home{background:white;color:var(--p3);border:2px solid var(--p3);border-radius:50px;padding:11px 32px;font-family:'Baloo 2',cursive;font-size:0.95rem;font-weight:700;cursor:pointer;width:100%;margin-bottom:8px;}
.word-of-day{background:linear-gradient(135deg,#FFF9E0,#FFF0E0);border-radius:14px;padding:16px;margin-top:18px;border-left:5px solid var(--p2);}
.wod-label{font-size:0.75rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#7A5A00;margin-bottom:10px;}
.wod-words{display:flex;flex-wrap:wrap;gap:8px;}
.wod-chip{background:white;border:2px solid var(--p2);border-radius:50px;padding:8px 14px;font-size:0.85rem;font-weight:700;color:var(--p2);}
</style>
</head>
<body>

<div class="topbar">
  <a class="home-btn" href="verden.html">← Tilbake</a>
  <div class="logo">📚 Når Edel ble inkludert</div>
  <div class="score" id="scoreDisplay">0/0</div>
</div>

<div class="container">
  <div class="lesson-wrap">
    <div class="lesson-header">
      <div class="lesson-title">Når Edel ble inkludert 🤝</div>
      <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
    </div>
    <div class="lesson-body" id="lessonBody"></div>
    <button class="btn-next" onclick="nextStep()">Neste →</button>
  </div>
  <div class="end-screen" id="endScreen"></div>
</div>

<script>
const STEPS = [
  {type:'scene', scenes:[{num:1, text:'En dag spurte barna Edel om å spille.', speech:'Vil du være med?'},{num:2, text:'Edel sa ja! Endelig!'}]},
  {type:'multiple', q:'Hva spurte barna Edel?', opts:[{t:'Hvor bor du?',c:false},{t:'Vil du være med?',c:true},{t:'Hva er navnet ditt?',c:false},{t:'Hvordan går det?',c:false}], fb:'✅ Riktig!'},
  {type:'multiple', q:'Hva svarte Edel?', opts:[{t:'Nei',c:false},{t:'Kanskje',c:false},{t:'Ja',c:true},{t:'Jeg vet ikke',c:false}], fb:'✅ Riktig!'},
  {type:'words', subtitle:'😊 Ordet INKLUDERT', words:[{w:'inkludert', m:'når du får være med i en gruppe', ex:'Edel ble inkludert da barna inviterte henne.', neg:false}]},
  {type:'fillin', sentence:'Edel ble ___ og hun var så glad!',opts:['inkludert','ekskludert','ensom'], correct:'inkludert', fb:'✅!'},
  {type:'multiple', q:'Hva var det motsatte av det som skjedde før?', opts:[{t:'Hun ble ekskludert',c:false},{t:'Hun ble inkludert',c:true},{t:'Hun var alene',c:false},{t:'Ingen svarte',c:false}], fb:'✅ Riktig!'},
  {type:'scene', scenes:[{num:3, text:'Nå spilte Edel med de andre barna.'},{num:4, text:'De lagde leker og lo sammen.'}]},
  {type:'multiple', q:'Hva gjorde Edel nå?', opts:[{t:'Satt alene',c:false},{t:'Spilte med de andre',c:true},{t:'Gikk hjem',c:false},{t:'Talte ikke',c:false}], fb:'✅!'},
  {type:'words', subtitle:'💚 Ordet TILHØRIGHET', words:[{w:'tilhørighet', m:'følelsen av å høre til og være akseptert', ex:'Edel følte tilhørighet når hun spilte med barna.', neg:false}]},
  {type:'fillin', sentence:'Hun følte ___ for første gang på lenge.',opts:['tilhørighet','utenforskap','tristhet'], correct:'tilhørighet', fb:'✅!'},
  {type:'multiple', q:'Hvordan følte Edel seg nå?', opts:[{t:'Alene og trist',c:false},{t:'Fryktet',c:false},{t:'Glad og akseptert',c:true},{t:'Redd',c:false}], fb:'✅!'},
  {type:'scene', scenes:[{num:5, text:'Edel så at det var andre barn som også stod alene.'},{num:6, text:'Hun husket hvordan det var å være ekskludert. Hun husket smerten.'}]},
  {type:'multiple', q:'Hva husket Edel?', opts:[{t:'En morsom historie',c:false},{t:'Hvordan det var å være ekskludert',c:true},{t:'Et leker',c:false},{t:'En sang',c:false}], fb:'✅!'},
  {type:'words', subtitle:'🤝 Ordet FELLESSKAP', words:[{w:'fellesskap', m:'å være en del av en gruppe hvor alle høres til', ex:'Edel ville skape fellesskap for alle.', neg:false}]},
  {type:'fillin', sentence:'Edel ville bygge ___ for alle barna.',opts:['fellesskap','krig','kaos'], correct:'fellesskap', fb:'✅!'},
  {type:'multiple', q:'Hva gjorde Edel når hun så andre barn alene?', opts:[{t:'Hun ignorerte dem',c:false},{t:'Hun inviterte dem',c:true},{t:'Hun lo av dem',c:false},{t:'Hun gikk bort',c:false}], fb:'✅!'},
  {type:'scene', scenes:[{num:7, text:'Edel gikk bort til en jente som stod alene.'},{num:8, text:'"Vil du være med oss?" spurte Edel. Jenten nikket ja og smilte.'},{num:9, text:'Nå var det tre barn som spilte sammen.'}]},
  {type:'multiple', q:'Hvem inviterte Edel?', opts:[{t:'En jente som stod alene',c:true},{t:'En lærer',c:false},{t:'Sitt familiemedlem',c:false},{t:'Ingen',c:false}], fb:'✅!'},
  {type:'multiple', q:'Hva var følelsen nå?', opts:[{t:'Ensom',c:false},{t:'Ekskludert',c:false},{t:'En stor fellesskap',c:true},{t:'Trist',c:false}], fb:'✅!'},
  {type:'fillin', sentence:'Edel følte seg ___ fordi hun kunne hjelpe andre.',opts:['stolt','skamfull','redd'], correct:'stolt', fb:'✅!'},
  {type:'multiple', q:'Hva lærte Edel fra sin egen erfaring?', opts:[{t:'At det er dårlig å dele',c:false},{t:'At det er viktig å inkludere andre',c:true},{t:'At venner er unødvendig',c:false},{t:'Ingenting',c:false}], fb:'✅!'},
  {type:'scene', scenes:[{num:10, text:'Fra den dagen av, prøvde Edel alltid å se barna som stod alene.'},{num:11, text:'Hun husket hvordan det var. Hun ville aldri at andre skulle føle seg sånn.'}]},
  {type:'fillin', sentence:'Edel husket sitt ___ og ville hjele andre.',opts:['smerte','glede','drøm'], correct:'smerte', fb:'✅!'},
  {type:'multiple', q:'Hva gjorde Edel når hun så andre barn som var ensom?', opts:[{t:'Hun inviterte dem',c:true},{t:'Hun lot dem være alene',c:false},{t:'Hun lo av dem',c:false},{t:'Hun fortalte det til læreren',c:false}], fb:'✅!'},
  {type:'words', subtitle:'🌈 Hele historien samlet', words:[{w:'ekskludert', m:'ikke få være med', ex:'Før følte Edel seg ekskludert.', neg:true},{w:'inkludert', m:'få være med', ex:'Så ble hun inkludert.', neg:false},{w:'tilhørighet', m:'høre til', ex:'Hun følte tilhørighet.', neg:false},{w:'fellesskap', m:'være sammen', ex:'Hun skapte fellesskap.', neg:false}]},
  {type:'fillin', sentence:'Edels reise: fra ___ til ___ til ___.',opts:['ekskludert, inkludert, tilhørighet','glad, sint, lei'],correct:'ekskludert, inkludert, tilhørighet', fb:'✅ Perfekt!'},
  {type:'multiple', q:'Hvilke tre ord beskriver Edels reise?', opts:[{t:'Ekskludert, inkludert, tilhørighet',c:true},{t:'Glad, lei seg, sint',c:false},{t:'Redd, modig, sterk',c:false},{t:'Ingen av disse',c:false}], fb:'✅!'},
];

let currentStep = 0;
let score = 0;
let totalQ = 0;
let answered = false;

function init(){
  renderStep();
  totalQ = STEPS.filter(s => s.type==='multiple' || s.type==='fillin').length;
}

function renderStep(){
  const lessonBody = document.getElementById('lessonBody');
  lessonBody.innerHTML = '';
  
  const step = STEPS[currentStep];
  let stepHtml = `<div class="step active">`;
  
  if(step.type === 'scene'){
    stepHtml += `<div class="step-label">📖 Les historien</div>`;
    step.scenes.forEach(s => {
      stepHtml += `<div class="scene-card">
        <div class="scene-num">Scene ${s.num}</div>
        <div class="scene-text">${s.text}</div>
        ${s.speech?`<div class="scene-speech">${s.speech}</div>`:''}
      </div>`;
    });
    stepHtml += `<button class="listen-btn" onclick="speakText('${step.scenes.map(s=>s.text+'. '+(s.speech||'')).join(' ')}')">
      🔊 Les høyt
    </button>`;
  }
  else if(step.type === 'multiple'){
    stepHtml += `<div class="step-label">❓ Spørsmål ${STEPS.filter((s,i)=>i<=currentStep && (s.type==='multiple'||s.type==='fillin')).length}</div>
      <div class="question-card">
        <div class="q-text">${step.q}</div>
        <div class="options">`;
    step.opts.forEach((o, i) => {
      stepHtml += `<button class="opt-btn" onclick="checkMult(${i},'${step.fb}')">${o.t}</button>`;
    });
    stepHtml += `</div><div class="feedback" id="feedback"></div></div>`;
  }
  else if(step.type === 'words'){
    stepHtml += `<div class="step-label">📚 ${step.subtitle}</div>`;
    step.words.forEach(w => {
      stepHtml += `<div class="word-card ${w.neg?'neg':''}">
        <div class="word-main">${w.neg?'😔':'😊'} ${w.w}</div>
        <div class="word-meaning">${w.m}</div>
        <div class="word-example">"${w.ex}"</div>
      </div>`;
    });
  }
  else if(step.type === 'fillin'){
    const parts = step.sentence.split('___');
    stepHtml += `<div class="step-label">✏️ Fyll inn ordet ${STEPS.filter((s,i)=>i<=currentStep && (s.type==='multiple'||s.type==='fillin')).length}</div>
      <div class="question-card">
        <div class="fill-sentence">${parts[0]}<span class="blank" id="blank">___</span>${parts[1]||''}</div>
        <div class="fill-opts">`;
    step.opts.forEach(o => {
      stepHtml += `<button class="fill-chip" onclick="checkFill('${o}','${step.correct}','${step.fb}')">${o}</button>`;
    });
    stepHtml += `</div><div class="feedback" id="feedback"></div></div>`;
  }
  
  stepHtml += `</div>`;
  lessonBody.innerHTML = stepHtml;
  
  const pct = Math.round(((currentStep+1) / STEPS.length) * 100);
  document.getElementById('progress').style.width = pct + '%';
  window.scrollTo(0, 0);
}

function speakText(text){
  if('speechSynthesis' in window){
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'no-NO';
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
  }
}

function checkMult(optIdx, fb){
  if(answered) return;
  answered = true;
  const step = STEPS[currentStep];
  const isCorrect = step.opts[optIdx].c;
  const btns = document.querySelectorAll('.opt-btn');
  btns.forEach(b => b.classList.add('disabled'));
  const fbEl = document.getElementById('feedback');
  
  if(isCorrect){
    btns[optIdx].classList.add('correct');
    score++;
    fbEl.textContent = fb;
    fbEl.className = 'feedback show correct';
  } else {
    btns[optIdx].classList.add('wrong');
    btns[step.opts.findIndex(o=>o.c)].classList.add('correct');
    fbEl.textContent = '❌ ' + fb;
    fbEl.className = 'feedback show wrong';
  }
}

function checkFill(chosen, correct, fb){
  if(answered) return;
  answered = true;
  const blank = document.getElementById('blank');
  const chips = document.querySelectorAll('.fill-chip');
  chips.forEach(c => c.classList.add('used'));
  const fbEl = document.getElementById('feedback');
  
  blank.textContent = chosen === correct ? chosen : correct;
  if(chosen === correct){
    chips.forEach(c => {if(c.textContent === correct) c.classList.add('correct')});
    score++;
    fbEl.textContent = fb;
    fbEl.className = 'feedback show correct';
  } else {
    chips.forEach(c => {
      if(c.textContent === chosen) c.classList.add('wrong');
      if(c.textContent === correct) c.classList.add('correct');
    });
    fbEl.textContent = '❌ ' + fb;
    fbEl.className = 'feedback show wrong';
  }
}

function nextStep(){
  currentStep++;
  if(currentStep >= STEPS.length){
    showEnd();
  } else {
    answered = false;
    renderStep();
  }
}

function showEnd(){
  const pct = Math.round((score / totalQ) * 100);
  const html = `
    <div class="end-emoji">🌟⭐✨</div>
    <div class="end-title">KJEMPEBRA, EDEL!</div>
    <div style="font-size:1.1rem;color:#666;margin:12px 0;">Du fullførte hele kapitelet!</div>
    <div class="score-big">${score}/${totalQ}</div>
    <div style="font-size:0.9rem;color:#888;margin-bottom:20px;">riktige svar (${pct}%)</div>
    <div style="background:#E8F5EC;border-radius:12px;padding:16px;margin-bottom:16px;font-size:0.95rem;line-height:1.6;">
      <strong>Du lærte:</strong><br>
      ✅ Hva ekskludert betyr<br>
      ✅ Hva inkludert betyr<br>
      ✅ Hva tilhørighet betyr<br>
      ✅ Hva fellesskap betyr<br>
      ✅ Hvordan det er å hjele andre
    </div>
    <button class="btn-home" onclick="window.location.href='verden.html'">← Tilbake til menyen</button>
  `;
  document.querySelector('.lesson-wrap').style.display = 'none';
  const endEl = document.getElementById('endScreen');
  endEl.innerHTML = html;
  endEl.classList.add('active');
  
  sendEmail();
  updateScore();
}

async function sendEmail(){
  const now = new Date();
  const dato = now.toLocaleDateString('no-NO',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  const tid = now.toLocaleTimeString('no-NO',{hour:'2-digit',minute:'2-digit'});
  const pct = Math.round((score / totalQ) * 100);
  
  try{
    await fetch('https://formspree.io/f/mqeolldg',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        _subject: `Edels Verden – Når Edel ble inkludert (UTVIDET) – ${dato}`,
        Dato: dato,
        Tidspunkt: tid,
        Kapittel: 'Når Edel ble inkludert (Utvidet med 24 øvelser)',
        Resultat: `${score} av ${totalQ} riktige (${pct}%)`,
        Vurdering: pct===100?'🌟 PERFEKT!':pct>=80?'✅ Utmerket!':pct>=70?'✅ Veldig bra!':'💪 God innsats!'
      })
    });
  } catch(e){ console.log(e); }
}

function updateScore(){
  document.getElementById('scoreDisplay').textContent = `${score}/${totalQ}`;
}

init();
</script>
</body>
</html>
