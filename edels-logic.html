<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edels Logic 🧮</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E3A4A; --bg2:#124C5F; --paper:#FFFDF7; --ink:#15323B;
  --mint:#3DD6A0; --mint-d:#2BAE82; --coral:#FF7A6B; --sun:#FFC94D;
  --line:#D6E4E2; --muted:#6B8A8E;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:0 0 60px;}
.wrap{max-width:560px;margin:0 auto;padding:16px;}

/* Top */
.top{display:flex;align-items:center;gap:10px;padding:6px 2px 14px;}
.home{ text-decoration:none;background:rgba(255,255,255,0.12);color:#fff;border-radius:12px;padding:8px 12px;font-size:1.2rem;}
.brand{font-family:'Fredoka',sans-serif;color:#fff;font-weight:700;font-size:1.35rem;letter-spacing:.5px;}
.brand small{display:block;font-size:.7rem;font-weight:600;color:#9FE6CC;letter-spacing:2px;text-transform:uppercase;}

/* Day picker */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-bottom:14px;}
.daybtn{background:var(--bg2);border:2px solid transparent;border-radius:14px;color:#cfeee3;padding:10px 4px;font-family:'Fredoka';font-weight:600;font-size:.95rem;cursor:pointer;text-align:center;line-height:1.1;}
.daybtn small{display:block;font-size:.6rem;color:#7fb8b0;font-weight:600;margin-top:2px;}
.daybtn.active{background:var(--mint);color:#06302a;border-color:#bff3df;}
.daybtn.done{border-color:var(--mint);}

/* Card */
.card{background:var(--paper);border-radius:22px;padding:18px;box-shadow:0 12px 30px rgba(0,0,0,.25);}
.card-title{font-family:'Fredoka';font-size:1.25rem;font-weight:700;color:var(--ink);margin-bottom:4px;}
.card-sub{font-size:.85rem;color:var(--muted);margin-bottom:14px;}

/* Ordbank */
.ordbank{background:#F0FAF6;border:2px dashed var(--mint);border-radius:14px;padding:12px 14px;margin-bottom:16px;}
.ordbank h3{font-family:'Fredoka';font-size:.95rem;color:var(--mint-d);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.ord{display:flex;gap:8px;font-size:.85rem;padding:3px 0;line-height:1.35;}
.ord b{color:var(--ink);min-width:74px;font-weight:800;}
.ord span{color:#4a6a6e;}

/* Shelf */
.shelf{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px;}
.shelf.four{grid-template-columns:repeat(2,1fr);}
.item{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center;}
.item img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:10px;background:#fff;}
.item .nm{font-size:.78rem;font-weight:700;margin-top:6px;line-height:1.2;min-height:2.2em;display:flex;align-items:center;justify-content:center;}
.item .pr{display:inline-block;margin-top:4px;background:var(--sun);color:#5a4500;font-weight:800;font-size:.85rem;padding:2px 10px;border-radius:20px;}

/* Basket box */
.basket{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.basket .b-list,.basket .b-money{flex:1;min-width:150px;border-radius:14px;padding:12px 14px;font-size:.85rem;}
.b-list{background:#EEF6FF;}
.b-money{background:#FFF7E6;}
.b-list h4,.b-money h4{font-family:'Fredoka';font-size:.95rem;margin-bottom:6px;}
.b-row{display:flex;justify-content:space-between;padding:2px 0;}
.b-row b{font-weight:800;}

/* Questions */
.q{border-top:1px solid var(--line);padding:14px 0;}
.q:first-of-type{border-top:none;}
.q-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;}
.q-num{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--bg2);color:#fff;font-weight:800;font-size:.85rem;display:flex;align-items:center;justify-content:center;}
.q-text{font-size:.92rem;font-weight:700;line-height:1.4;padding-top:2px;}
.hint{display:inline-flex;align-items:center;gap:5px;background:#FFF1EE;color:var(--coral);font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:20px;margin:4px 0 0 36px;}
.ans-row{display:flex;gap:8px;align-items:center;margin:8px 0 0 36px;}
.ans{flex:1;border:2px solid var(--line);border-radius:12px;padding:11px 12px;font-family:'Nunito';font-size:1rem;font-weight:700;color:var(--ink);background:#fff;}
.ans:focus{outline:none;border-color:var(--mint);}
.unit{font-weight:800;color:var(--muted);}
.check{background:var(--mint);color:#06302a;border:none;border-radius:12px;padding:11px 16px;font-family:'Fredoka';font-weight:600;font-size:.9rem;cursor:pointer;box-shadow:0 3px 0 var(--mint-d);}
.check:active{transform:translateY(2px);box-shadow:0 1px 0 var(--mint-d);}
.fb{margin:8px 0 0 36px;font-size:.85rem;font-weight:700;padding:8px 12px;border-radius:10px;display:none;}
.fb.ok{display:block;background:#E6F8F0;color:var(--mint-d);}
.fb.no{display:block;background:#FFEDEA;color:var(--coral);}

/* choice chips for budsjett */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0 36px;}
.chip{border:2px solid var(--line);background:#fff;border-radius:20px;padding:8px 14px;font-weight:700;font-size:.85rem;cursor:pointer;}
.chip.sel{background:var(--mint);border-color:var(--mint-d);color:#06302a;}

/* Finish */
.finish{margin-top:18px;text-align:center;}
.send{width:100%;background:var(--coral);color:#fff;border:none;border-radius:16px;padding:15px;font-family:'Fredoka';font-weight:700;font-size:1.05rem;cursor:pointer;box-shadow:0 4px 0 #d65648;}
.send:active{transform:translateY(2px);box-shadow:0 2px 0 #d65648;}
.score-pill{display:inline-block;margin-bottom:10px;background:var(--bg2);color:#cfeee3;padding:6px 16px;border-radius:20px;font-weight:800;font-size:.9rem;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:30px;font-weight:700;font-size:.9rem;opacity:0;transition:opacity .3s;z-index:99;}
.toast.show{opacity:1;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>

const FORM = 'https://formspree.io/f/mqeolldg';

const ORDBANK = [
  ['pris','hvor mye noe koster'],
  ['koster','prisen p\u00e5 varen'],
  ['til sammen','alt pluss alt'],
  ['igjen','penger som er tilbake'],
  ['nok','du har penger til \u00e5 kj\u00f8pe'],
  ['billigst','det som koster minst'],
  ['dyrest','det som koster mest'],
  ['handlekurv','varene Edel vil kj\u00f8pe'],
];

let current = 0;
const state = {}; // per-day: {score, total, written:[]}

function money(k){ return PRODUCTS[k][1]; }
function name(k){ return PRODUCTS[k][0]; }

function renderDays(){
  const el = document.getElementById('days');
  el.innerHTML = DAYS.map((d,i)=>{
    const done = state[i] && state[i].finished;
    const lbl = i<2 ? (i+1) : (i+1);
    return `<button class="daybtn ${i===current?'active':''} ${done?'done':''}" onclick="go(${i})">
      ${i+1}<small>${d.t==='butikk'?'butikk':d.t==='kurv'?'kurv':'budsjett'}</small></button>`;
  }).join('');
}

function go(i){ current=i; render(); window.scrollTo({top:0,behavior:'smooth'}); }

function ordbankHTML(){
  return `<div class="ordbank"><h3>\📖 Ordbank \u2013 les ordene f\u00f8rst</h3>
    ${ORDBANK.map(o=>`<div class="ord"><b>${o[0]}</b><span>${o[1]}</span></div>`).join('')}</div>`;
}

function itemHTML(k,showPrice=true){
  return `<div class="item"><img src="${IMGS[k]}" alt="${name(k)}">
    <div class="nm">${name(k)}</div>
    ${showPrice?`<div class="pr">${money(k)} kr</div>`:''}</div>`;
}

function render(){
  renderDays();
  const d = DAYS[current];
  if(!state[current]) state[current]={score:0,total:0,written:[],finished:false};
  let h = `<div class="card"><div class="card-title">${d.title}</div>
    <div class="card-sub">Se p\u00e5 prisene og regn ut. Du klarer dette \💪</div>`;
  h += ordbankHTML();

  if(d.t==='butikk') h += renderButikk(d);
  else if(d.t==='kurv') h += renderKurv(d);
  else h += renderBudsjett(d);

  h += `<div class="finish">
    <div class="score-pill" id="pill">0 / ${state[current].total||0} riktige</div>
    <button class="send" onclick="finish()">\📨 Send svar til mamma</button>
  </div></div>`;
  document.getElementById('stage').innerHTML = h;
  recountTotal();
}

function qBlock(n, text, hintTxt, inputId, unit){
  return `<div class="q"><div class="q-head"><div class="q-num">${n}</div>
    <div class="q-text">${text}</div></div>
    ${hintTxt?`<div class="hint">\u{1F4A1} ${hintTxt}</div>`:''}
    <div class="ans-row">
      <input class="ans" id="${inputId}" inputmode="numeric" placeholder="?">
      ${unit?`<span class="unit">${unit}</span>`:''}
      <button class="check" onclick="checkNum('${inputId}')">Sjekk</button>
    </div>
    <div class="fb" id="fb_${inputId}"></div></div>`;
}
function qText(n, text, hintTxt, inputId, correctList){
  window.__txt = window.__txt||{}; window.__txt[inputId]=correctList;
  return `<div class="q"><div class="q-head"><div class="q-num">${n}</div>
    <div class="q-text">${text}</div></div>
    ${hintTxt?`<div class="hint">\u{1F4A1} ${hintTxt}</div>`:''}
    <div class="ans-row">
      <input class="ans" id="${inputId}" placeholder="skriv her">
      <button class="check" onclick="checkText('${inputId}')">Sjekk</button>
    </div>
    <div class="fb" id="fb_${inputId}"></div></div>`;
}

function renderButikk(d){
  const it=d.items;
  let h=`<div class="shelf four">${it.map(k=>itemHTML(k)).join('')}</div>`;
  let n=0;
  // price reading
  it.forEach((k,idx)=>{ n++; h+=qBlock(n,`Hva koster <b>${name(k)}</b>?`, null, `b${current}_p${idx}`,'kr');
    window.__ans=window.__ans||{}; window.__ans[`b${current}_p${idx}`]=money(k); });
  // sumA
  n++; const a=d.sumA; h+=qBlock(n,`Edel kj\u00f8per <b>${name(a[0])}</b> og <b>${name(a[1])}</b>. Hvor mye koster det til sammen?`,'til sammen = legg sammen',`b${current}_sa`,'kr');
  window.__ans[`b${current}_sa`]=money(a[0])+money(a[1]);
  // sumB
  n++; const b=d.sumB; h+=qBlock(n,`Edel kj\u00f8per <b>${name(b[0])}</b> og <b>${name(b[1])}</b>. Hvor mye koster det til sammen?`,'til sammen = legg sammen',`b${current}_sb`,'kr');
  window.__ans[`b${current}_sb`]=money(b[0])+money(b[1]);
  // change
  n++; const c=d.changeItem; h+=qBlock(n,`Edel har <b>100 kr</b>. Hun kj\u00f8per <b>${name(c)}</b>. Hvor mye har hun igjen?`,'igjen = 100 minus prisen',`b${current}_ch`,'kr');
  window.__ans[`b${current}_ch`]=100-money(c);
  // billigst/dyrest
  const prices=it.map(money); const minK=it[prices.indexOf(Math.min(...prices))]; const maxK=it[prices.indexOf(Math.max(...prices))];
  n++; h+=qText(n,`Hva er <b>billigst</b>?`,'billigst = koster minst',`b${current}_bi`,[name(minK).toLowerCase()]);
  n++; h+=qText(n,`Hva er <b>dyrest</b>?`,'dyrest = koster mest',`b${current}_dy`,[name(maxK).toLowerCase()]);
  return h;
}

function renderKurv(d){
  const it=d.items; const sum=it.reduce((s,k)=>s+money(k),0); const bud=d.budget;
  let h=`<div class="shelf">${it.map(k=>itemHTML(k)).join('')}</div>`;
  h+=`<div class="basket">
    <div class="b-list"><h4>\u{1F6D2} Edel sin handlekurv</h4>
      ${it.map(k=>`<div class="b-row"><span>${name(k)}</span><b>${money(k)} kr</b></div>`).join('')}</div>
    <div class="b-money"><h4>\u{1F4B0} Edel har ${bud} kr</h4>
      <div class="b-row"><span>Hun vil vite:</span></div>
      <div class="b-row"><span>1. Hvor mye koster alt?</span></div>
      <div class="b-row"><span>2. Hvor mye har hun igjen?</span></div></div></div>`;
  let n=0;
  n++; h+=qBlock(n,`Regn ut: <b>${money(it[0])} + ${money(it[1])} + ${money(it[2])}</b> = ?`,'legg sammen de tre prisene',`k${current}_sum`,'kr');
  window.__ans=window.__ans||{}; window.__ans[`k${current}_sum`]=sum;
  n++; h+=qBlock(n,`Edel har <b>${bud} kr</b>. Hvor mye har hun igjen etter kj\u00f8pet?`,`igjen = ${bud} minus alt`,`k${current}_ch`,'kr');
  window.__ans[`k${current}_ch`]=bud-sum;
  n++; h+=qText(n,`Har Edel <b>nok</b> penger? Skriv ja eller nei.`,'nok = har hun penger til alt?',`k${current}_nok`, [bud>=sum?'ja':'nei']);
  const prices=it.map(money); const minK=it[prices.indexOf(Math.min(...prices))]; const maxK=it[prices.indexOf(Math.max(...prices))];
  n++; h+=qText(n,`Hvilken vare er <b>billigst</b>?`,'koster minst',`k${current}_bi`,[name(minK).toLowerCase()]);
  n++; h+=qText(n,`Hvilken vare er <b>dyrest</b>?`,'koster mest',`k${current}_dy`,[name(maxK).toLowerCase()]);
  return h;
}

function renderBudsjett(d){
  const it=d.items; const bud=d.budget;
  let h=`<div class="shelf four">${it.map(k=>itemHTML(k)).join('')}</div>`;
  h+=`<div class="b-money" style="margin-bottom:16px"><h4>\u{1F4B0} Edel har ${bud} kr</h4>
    <div class="b-row"><span>Hun kan kj\u00f8pe \u00e9n, to eller tre varer. Velg, regn ut, og sjekk om hun har nok.</span></div></div>`;
  // selection chips
  h+=`<div class="q"><div class="q-head"><div class="q-num">\u2713</div><div class="q-text">Velg varene dine:</div></div>
    <div class="chips" id="bud${current}_chips">
    ${it.map(k=>`<button class="chip" data-k="${k}" data-p="${money(k)}" onclick="toggleChip(this,${current})">${name(k)} \u00b7 ${money(k)} kr</button>`).join('')}
    </div>
    <div class="fb" id="fb_bud${current}_chips" style="margin-left:36px"></div></div>`;
  let n=0;
  n++; h+=qBlock(n,`Hvor mye koster varene du valgte <b>til sammen</b>?`,'legg sammen det du valgte',`bud${current}_sum`,'kr');
  n++; h+=qBlock(n,`Hvor mye har Edel <b>igjen</b> av ${bud} kr?`,`${bud} minus det du valgte`,`bud${current}_ch`,'kr');
  n++; h+=qText(n,`Kan hun kj\u00f8pe <b>\u00e9n vare til</b>? Skriv ja eller nei.`,'har hun nok igjen?',`bud${current}_more`,['ja','nei']);
  window.__bud=window.__bud||{}; window.__bud[current]={budget:bud,sel:[]};
  return h;
}

function toggleChip(btn,day){
  btn.classList.toggle('sel');
  const sel=[...document.querySelectorAll(`#bud${day}_chips .chip.sel`)];
  window.__bud[day].sel = sel.map(b=>({k:b.dataset.k,p:+b.dataset.p}));
  // dynamic answers
  const tot=window.__bud[day].sel.reduce((s,o)=>s+o.p,0);
  window.__ans=window.__ans||{};
  window.__ans[`bud${day}_sum`]=tot;
  window.__ans[`bud${day}_ch`]=window.__bud[day].budget - tot;
}


function flash(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1400); }

function recountTotal(){
  // count gradable questions present
  const inputs=document.querySelectorAll('.ans');
  state[current].total = inputs.length;
  const pill=document.getElementById('pill');
  if(pill) pill.textContent = `${state[current].score} / ${state[current].total} riktige`;
}

function markScored(id, ok){
  state[current].scored=state[current].scored||{};
  if(state[current].scored[id]===undefined){
    state[current].scored[id]=ok; if(ok) state[current].score++;
  } else if(state[current].scored[id]===false && ok){
    state[current].scored[id]=true; state[current].score++;
  }
  const pill=document.getElementById('pill');
  if(pill) pill.textContent = `${state[current].score} / ${state[current].total} riktige`;
}

function checkNum(id){
  const v=(document.getElementById(id).value||'').replace(/\s/g,'').replace(',','.');
  const fb=document.getElementById('fb_'+id);
  const correct=window.__ans[id];
  if(v===''){ fb.className='fb no'; fb.textContent='\u270F\uFE0F Skriv et tall f\u00f8rst'; return; }
  if(Number(v)===Number(correct)){ fb.className='fb ok'; fb.textContent='\u2705 Riktig! Bra jobba.'; markScored(id,true); }
  else { fb.className='fb no'; fb.textContent='\u{1F914} Pr\u00f8v igjen \u2013 sjekk tallene en gang til.'; markScored(id,false); }
}

function checkText(id){
  const raw=(document.getElementById(id).value||'').trim().toLowerCase();
  const fb=document.getElementById('fb_'+id);
  const list=(window.__txt[id]||[]).map(s=>s.toLowerCase());
  if(raw===''){ fb.className='fb no'; fb.textContent='\u270F\uFE0F Skriv et svar f\u00f8rst'; return; }
  const ok=list.some(c=> raw===c || raw.includes(c) || c.includes(raw));
  if(ok){ fb.className='fb ok'; fb.textContent='\u2705 Riktig!'; markScored(id,true); }
  else { fb.className='fb no'; fb.textContent='\u{1F914} Ikke helt \u2013 se p\u00e5 ordbanken.'; markScored(id,false); }
}

async function finish(){
  // collect any written answers (text inputs) for mamma
  const written=[];
  document.querySelectorAll('.ans').forEach(inp=>{
    if(inp.value.trim()) written.push(inp.value.trim());
  });
  state[current].finished=true; renderDays();
  const d=DAYS[current];
  const pct = state[current].total ? Math.round(state[current].score/state[current].total*100):0;
  const now=new Date();
  try{
    await fetch(FORM,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        _subject:`Edels Logic \u2013 ${d.title}`,
        Dato: now.toLocaleString('no-NO'),
        Oppgave: d.title,
        Resultat: `${state[current].score} av ${state[current].total} riktige (${pct}%)`,
        Vurdering: pct===100?'\u{1F31F} Perfekt!':pct>=70?'\u2705 Veldig bra!':'\u{1F4AA} Fortsett \u00e5 \u00f8ve!',
        Edel_svarte: written.join(' | ')
      })});
    flash('\u{1F4E8} Sendt til mamma!');
  }catch(e){ flash('Lagret lokalt \u2013 sjekk nett'); }
}

renderDays(); render();
</script>
